components:
  messages:
    OrderCreated:
      name: order.created
      title: Order created
      payload:
        $ref: '../schemas/events.yaml#/$defs/OrderCreated'
      x-producer: Orders
      x-partition-key: order_id
    ReservationRequested:
      name: inventory.reservation.requested
      title: Inventory reservation requested
      payload:
        $ref: '../schemas/events.yaml#/$defs/ReservationRequested'
      x-producer: Orders
      x-partition-key: order_id
    ReservationReserved:
      name: inventory.reserved
      title: Inventory reservation accepted
      payload:
        $ref: '../schemas/events.yaml#/$defs/ReservationReserved'
      x-producer: Inventory
      x-partition-key: order_id
    ReservationRejected:
      name: inventory.rejected
      title: Inventory reservation rejected
      payload:
        $ref: '../schemas/events.yaml#/$defs/ReservationRejected'
      x-producer: Inventory
      x-partition-key: order_id
    PaymentRequested:
      name: payment.requested
