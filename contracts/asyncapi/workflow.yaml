asyncapi: 3.0.0
info:
  title: EventFlow Order Workflow
  version: 1.0.0
  description: >-
    Initial asynchronous workflow contract. Messages use the common envelope,
    assume at-least-once delivery and use order_id as the partition key for
    Order workflow messages where applicable. Broker ordering does not enforce
    the Inventory stock invariant. Consumers must acknowledge only after their
    local Inbox/domain transaction succeeds, tolerate duplicate and delayed
    messages, and route invalid or exhausted messages according to DLQ policy.
    correlation_id remains stable for the business workflow; causation_id is
    the event_id of the immediate cause when applicable.
defaultContentType: application/json
servers:
  broker:
    host: broker.example.invalid:9092
    protocol: kafka
    description: Planned Kafka-compatible broker endpoint
channels:
  orderWorkflow:
    address: eventflow.order.workflow.v1
    description: Commands and events for the Order Saga.
    messages:
      orderCreated:
        $ref: '#/components/messages/OrderCreated'
      reservationRequested:
        $ref: '#/components/messages/ReservationRequested'
      reservationReserved:
        $ref: '#/components/messages/ReservationReserved'
      reservationRejected:
        $ref: '#/components/messages/ReservationRejected'
      paymentRequested:
        $ref: '#/components/messages/PaymentRequested'
      paymentApproved:
        $ref: '#/components/messages/PaymentApproved'
      paymentDeclined:
        $ref: '#/components/messages/PaymentDeclined'
      paymentProcessing:
        $ref: '#/components/messages/PaymentProcessing'
      paymentUnknown:
        $ref: '#/components/messages/PaymentUnknown'
      releaseRequested:
        $ref: '#/components/messages/ReleaseRequested'
      released:
        $ref: '#/components/messages/Released'
      compensationRequested:
        $ref: '#/components/messages/CompensationRequested'
      compensated:
        $ref: '#/components/messages/Compensated'
      orderConfirmed:
        $ref: '#/components/messages/OrderConfirmed'
      orderCancelled:
        $ref: '#/components/messages/OrderCancelled'
operations:
  publishOrderCreated:
    action: send
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/orderCreated'
  publishReservationRequested:
    action: send
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/reservationRequested'
  consumeReservationRequested:
    action: receive
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/reservationRequested'
  publishReservationReserved:
    action: send
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/reservationReserved'
  publishReservationRejected:
    action: send
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/reservationRejected'
  ordersConsumeReservationReserved:
    action: receive
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/reservationReserved'
  ordersConsumeReservationRejected:
    action: receive
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/reservationRejected'
  publishPaymentRequested:
    action: send
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/paymentRequested'
  consumePaymentRequested:
    action: receive
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/paymentRequested'
  publishPaymentApproved:
    action: send
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/paymentApproved'
  publishPaymentDeclined:
    action: send
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/paymentDeclined'
  ordersConsumePaymentApproved:
    action: receive
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/paymentApproved'
  ordersConsumePaymentDeclined:
    action: receive
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/paymentDeclined'
  publishPaymentProcessing:
    action: send
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/paymentProcessing'
  ordersConsumePaymentProcessing:
    action: receive
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/paymentProcessing'
  publishPaymentUnknown:
    action: send
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/paymentUnknown'
  ordersConsumePaymentUnknown:
    action: receive
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/paymentUnknown'
  publishReleaseRequested:
    action: send
    channel:
      $ref: '#/channels/orderWorkflow'
    messages:
      - $ref: '#/channels/orderWorkflow/messages/releaseRequested'
  consumeReleaseRequested:
    action: receive
    channel:
      $ref: '#/channels/orderWorkflow'
