openapi: 3.1.0
info:
  title: EventFlow Work Management API
  version: 1.0.0
  description: >-
    Authoritative, versioned HTTP contract for Work Management (Consultations,
    Triage, Proposals, Approvals, WorkItems, and BoardCards). Shared by the
    Webapp, VS Code Extension, and Desktop Application clients. The public API
    version is carried in the `/v1/` URL prefix; breaking changes require a new
    prefix. Errors use RFC 9457 problem details
    (application/problem+json). Mutating operations that a client may retry
    accept an optional `Idempotency-Key`; the approval decision requires it.
    Authorization requirements are declared per operation through
    `x-required-roles` and must be enforced by the backend. See
    `docs/architecture/work-management-api.md` for the compatibility policy.
servers:
  - url: https://api.eventflow.invalid
    description: Planned Work Management Gateway / BFF endpoint
tags:
  - name: Consultations
  - name: Triage
  - name: Proposals
  - name: Approvals
  - name: WorkItems
  - name: Boards
  - name: Workspaces
  - name: Projects
  - name: Members
  - name: Invitations
paths:
  /v1/workspaces/{workspace_id}/consultations:
    post:
      operationId: createConsultation
      tags: [Consultations]
      summary: Submit a new consultation (raw intake)
      description: >-
        Records a raw intake consultation in OPEN state. A consultation is not
        a task and never enters a board directly. Priority starts at medium until
        an authorized triage operation assigns the classified priority.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/CreateConsultationRequest'
      responses:
        '201':
          description: Consultation recorded in OPEN state.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              description: URI of the created consultation resource.
              schema:
                type: string
                format: uri-reference
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

    get:
      operationId: listConsultations
      tags: [Consultations]
      summary: List consultations within a workspace
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      x-allowed-sort-fields: [created_at, updated_at, priority, status]
      x-default-sort-fields: [created_at, consultation_id]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ConsultationStatus'
        - name: category
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/TriageCategory'
        - name: priority
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/Priority'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: A page of consultations.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/ConsultationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/consultations/drafts:
    post:
      operationId: createConsultationDraft
      tags: [Consultations]
      summary: Create a draft consultation
      description: >-
        Records a consultation in DRAFT state. A draft is an unsubmitted intake
        that cannot be triaged until it is submitted, which transitions it to
        OPEN. Drafts let offline-capable clients persist intake before submission.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/CreateConsultationRequest'
      responses:
        '201':
          description: Draft consultation created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              description: URI of the created consultation resource.
              schema:
                type: string
                format: uri-reference
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/consultations/{consultation_id}/triage:
    post:
      operationId: triageConsultation
      tags: [Triage]
      summary: Classify and triage an intake consultation
      security:
        - bearerAuth: []
      x-required-roles: [triager, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/TriageConsultationRequest'
      responses:
        '200':
          description: Consultation triaged successfully.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/consultations/{consultation_id}/submit:
    post:
      operationId: submitConsultationDraft
      tags: [Consultations]
      summary: Submit a draft consultation
      description: >-
        Transitions a DRAFT consultation to OPEN, making it eligible for triage.
        Only the draft author or a workspace administrator may submit it. An
        already-submitted consultation returns 409 Conflict.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Draft submitted and now in OPEN state.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/consultations/{consultation_id}:
    get:
      operationId: getConsultation
      tags: [Consultations]
      summary: Retrieve one consultation within a workspace
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The requested consultation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

    patch:
      operationId: updateConsultationDraft
      tags: [Consultations]
      summary: Edit a draft consultation
      description: >-
        Applies a partial update to a DRAFT consultation. Only the draft author
        or a workspace administrator may edit it, and only while it remains in
        DRAFT state; editing any other status returns 409 Conflict.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/UpdateConsultationDraftRequest'
      responses:
        '200':
          description: Draft consultation updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/proposals:
    post:
      operationId: createProposal
      tags: [Proposals]
      summary: Draft a proposal derived from a triaged consultation
      description: >-
        Creates a proposal in DRAFT state. It does not create a WorkItem or
        allocate execution capacity. The referenced consultation must be
        visible in this workspace and in a state that permits proposal creation;
        an invalid lifecycle state returns 409. Each accepted creation receives
        the next version for that consultation, starting at version 1.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/CreateProposalRequest'
      responses:
        '201':
          description: Proposal created in DRAFT state. Does not create a WorkItem.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              description: URI of the created proposal resource.
              schema:
                type: string
                format: uri-reference
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/proposals/{proposal_id}/submit:
    post:
      operationId: submitProposalForReview
      tags: [Proposals]
      summary: Submit a draft proposal for formal peer review
      description: >-
        Only the proposal's proposer or an authorized workspace administrator
        may submit it. It must be in DRAFT or CHANGES_REQUESTED; an invalid
        lifecycle state returns 409.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Proposal transitioned to IN_REVIEW.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/proposals/{proposal_id}:
    get:
      operationId: getProposal
      tags: [Proposals]
      summary: Retrieve one proposal version within a workspace
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The requested proposal version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/proposals/{proposal_id}/decide:
    post:
      operationId: decideProposal
      tags: [Approvals]
      summary: Formally approve, reject, or request changes on a proposal
      description: >-
        Submits an approval decision bound to an exact proposal version. When
        the decision is 'approved', the WorkItem and initial BoardCard are
        required by this contract to be generated atomically and idempotently.
        The Idempotency-Key header is required. A successful HTTP replay is a
        contract requirement; the current persistence repository provides
        database-level idempotent decision-effect recovery but does not
        rehydrate the full HTTP response body or integrate the complete
        decision, WorkItem, BoardCard, and response replay workflow.
      security:
        - bearerAuth: []
      x-required-roles: [approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/DecideProposalRequest'
      responses:
        '200':
          description: Decision recorded. If approved, includes generated WorkItem and BoardCard.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/DecideProposalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/work-items:
    get:
      operationId: listWorkItems
      tags: [WorkItems]
      summary: List authorized work items
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      x-allowed-sort-fields: [created_at, updated_at, priority, status]
      x-default-sort-fields: [created_at, work_item_id]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/WorkItemStatus'
        - name: category
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/TriageCategory'
        - name: priority
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/Priority'
        - name: assignee_id
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/UUID'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: A page of authorized work items.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/WorkItemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/work-items/{work_item_id}:
    get:
      operationId: getWorkItem
      tags: [WorkItems]
      summary: Retrieve one work item within a workspace
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: work_item_id
          in: path
          required: true
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/UUID'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The requested work item.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/WorkItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/boards/{board_id}:
    get:
      operationId: getBoard
      tags: [Boards]
      summary: Retrieve one board within a workspace
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The requested board and its column definitions.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Board'
