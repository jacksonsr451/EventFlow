        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/OverridePriorityRequest'
      responses:
        '200':
          description: Priority override applied.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/PriorityOverrideResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/work-items/{work_item_id}/dependencies:
    get:
      operationId: listWorkItemDependencies
      tags: [WorkItems]
      summary: List the blockers and dependents of one WorkItem
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/WorkItemId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Directed dependency edges for this WorkItem.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/DependencyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

    post:
      operationId: createWorkItemDependency
      tags: [WorkItems]
      summary: Record that another WorkItem blocks this WorkItem
      description: >-
        Duplicate edges replay the existing edge. Self-edges are rejected and a
        cycle returns 409 DEPENDENCY_CYCLE; detection is enforced in the
        database transaction under a workspace lock.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/WorkItemId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/CreateDependencyRequest'
      responses:
        '201':
          description: Dependency edge recorded or replayed.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/WorkItemDependency'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/work-items/{work_item_id}/dependencies/{dependency_id}:
    delete:
      operationId: deleteWorkItemDependency
      tags: [WorkItems]
      summary: Remove a dependency edge from this WorkItem
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/WorkItemId'
        - $ref: '#/components/parameters/DependencyId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Dependency edge removed (or already absent for a replay).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/notifications:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: List the authenticated actor's durable notifications
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      x-allowed-sort-fields: [created_at]
      x-default-sort-fields: [created_at, notification_id]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: unread_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: One page of notifications addressed to the actor.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/NotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/notifications/{notification_id}:
    patch:
      operationId: markNotification
      tags: [Notifications]
      summary: Mark one of the actor's notifications read or unread
      description: |
        Marking an already-read notification or clearing an already-unread
        notification leaves its representation and ETag unchanged. This operation
        is naturally idempotent and does not accept an ``Idempotency-Key``.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/NotificationId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/MarkNotificationRequest'
      responses:
        '200':
          description: Notification read state updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/notification-preferences:
    get:
      operationId: listNotificationPreferences
      tags: [Notifications]
      summary: List the actor's notification channel preferences
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Explicit per-event preferences for the actor.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/NotificationPreferenceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/notification-preferences/{event_type}:
    put:
      operationId: updateNotificationPreference
      tags: [Notifications]
      summary: Set the actor's channel preference for one event type
      description: |
        Re-writing identical channel values leaves the representation and ETag
        unchanged. This operation is naturally idempotent and does not accept an
        ``Idempotency-Key``.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/NotificationEventType'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/UpdatePreferenceRequest'
      responses:
        '200':
          description: Preference stored for the actor.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/NotificationPreference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT validation and authorization must be enforced by the gateway. Required
        issuer, audience, algorithms, and claims remain deployment
        configuration; workspace membership and RBAC checks are server-side
        requirements. Issue #11 defines these requirements but implements no
        authentication or authorization runtime.

  schemas:
    Problem400:
      allOf:
        - $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
        - type: object
          properties:
            status:
              const: 400
    Problem401:
      allOf:
        - $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
        - type: object
          properties:
            status:
              const: 401
    Problem403:
      allOf:
        - $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
        - type: object
          properties:
            status:
              const: 403
    Problem404:
      allOf:
        - $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
        - type: object
          properties:
            status:
              const: 404
    Problem409:
      allOf:
        - $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
        - type: object
          properties:
            status:
              const: 409
    Problem412:
      allOf:
        - $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
        - type: object
          properties:
            status:
              const: 412
    Problem422:
      allOf:
        - $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
        - type: object
          properties:
            status:
              const: 422
    Problem503:
      allOf:
        - $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
        - type: object
          properties:
            status:
              const: 503

  parameters:
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    ConsultationId:
      name: consultation_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    AttachmentId:
      name: attachment_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    MembershipId:
      name: membership_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    BoardId:
      name: board_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    BoardCardId:
      name: card_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    WorkItemId:
      name: work_item_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    PolicyId:
      name: policy_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    DependencyId:
      name: dependency_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    NotificationEventType:
      name: event_type
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/NotificationEventType'
    BoardColumnId:
      name: column_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    RepositoryId:
      name: repository_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    EntityCollection:
      name: entity_collection
      in: path
      required: true
      description: >-
        Public collection segment selecting the collaboration target. Unknown
        values return 404 so an unsupported target is not distinguishable from a
        hidden one.
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/EntityCollection'
    AttachmentEntityCollection:
      name: entity_collection
      in: path
      required: true
      description: >-
        Public collection segment selecting the generic attachment target.
        Consultations keep their dedicated Issue #4 routes; an unsupported or
        hidden target returns 404.
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/AttachmentEntityCollection'
    EntityId:
      name: entity_id
      in: path
      required: true
      description: Identifier of the target entity within the selected collection.
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    CommentId:
      name: comment_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: >-
        Existing business workflow identifier when applicable. The gateway
        generates one when absent, validates a supplied UUID, and returns the
        effective value in X-Correlation-ID.
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable client key for one approval-decision operation. The key namespace
        is (workspace_id, operationId, key), matching the persistence uniqueness
        scope. Within that namespace, an equivalent request replays the original
        HTTP status and body, including concurrent duplicates; a different
        request fingerprint returns 409. The same key in another workspace or
        operation is independent. This is a contract requirement, not a claim
        that an HTTP handler currently implements replay.
      x-idempotency-scope: [workspace_id, operationId]
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._~-]{8,128}$'
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional stable client key for a retryable operation. When supplied, the
        key namespace is (workspace_id, operationId, key). Within that namespace,
        an equivalent request replays the original HTTP status and body,
        including concurrent duplicates; a different request fingerprint
        returns 409. The same key in another workspace or operation is
        independent. This is a contract requirement, not a claim that an HTTP
        handler currently implements replay. Offline-capable clients must send
        it.
      x-idempotency-scope: [workspace_id, operationId]
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._~-]{8,128}$'
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as page_info.next_cursor by the previous page.
      x-cursor-binding: [workspace_id, operationId, filters, sort]
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Sort:
      name: sort
      in: query
      required: false
      description: >-
        Comma-separated sort keys; prefix a key with '-' for descending order.
        Allowed keys are listed per operation. Ordering is deterministic and
        keyset-based, with the resource identifier as a unique final tie-breaker.
        The contract does not promise snapshot isolation across pages.
      x-ordering: stable_keyset_with_resource_id_tiebreaker
      x-snapshot-isolation: false
      schema:
        type: string
        pattern: '^-?[a-z_]+(,-?[a-z_]+)*$'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        Optional strong ETag validator previously returned for this exact
        resource. Weak validators and wildcard/list forms are not accepted; a
        stale value yields 412 Precondition Failed.
      schema:
        type: string
        pattern: '^"[^"]+"$'

  headers:
    CorrelationId:
      description: Business workflow correlation identifier.
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    RequestId:
      description: Identifier for this HTTP request.
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    ETag:
      description: Opaque entity or collection version used for optimistic concurrency.
      schema:
        type: string
        pattern: '^"[^"]+"$'

  responses:
    BadRequest:
      description: Malformed request, invalid parameter, or validation failure.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem400'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem401'
    Forbidden:
      description: The principal is authenticated but lacks the required workspace role.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem403'
    NotFound:
      description: >-
        The resource does not exist or is not visible to the caller; existence
        of another workspace's resource is never disclosed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem404'
    Conflict:
      description: >-
        Optimistic-locking, idempotency, or invalid state-transition conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem409'
    PreconditionFailed:
      description: The If-Match precondition did not match the current entity version.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem412'
    UnprocessableEntity:
      description: The request is syntactically correct but semantically invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem422'
    ServiceUnavailable:
      description: A required authoritative dependency is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem503'
    UnexpectedError:
      description: >-
        Unexpected server failure. The response uses a sanitized problem body;
        a mutation must not expose internal details or leave a partial database
        effect.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
