openapi: 3.1.0
info:
  title: EventFlow Work Management API
  version: 1.0.0
  description: >-
    Authoritative HTTP contract for Work Management (Consultations, Triage,
    Proposals, Approvals, WorkItems, and BoardCards). Shared by Webapp,
    VS Code Extension, and Desktop Application clients.
servers:
  - url: https://api.eventflow.invalid
    description: Planned Work Management Gateway / BFF endpoint
tags:
  - name: Consultations
  - name: Triage
  - name: Proposals
  - name: Approvals
  - name: WorkItems
  - name: Boards

paths:
  /v1/workspaces/{workspace_id}/consultations:
    post:
      operationId: createConsultation
      tags: [Consultations]
      summary: Submit a new consultation (raw intake)
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, origin, title, description]
              properties:
                project_id:
                  $ref: '../schemas/work_management.yaml#/$defs/UUID'
                origin:
                  $ref: '../schemas/work_management.yaml#/$defs/Origin'
                title:
                  type: string
                  minLength: 3
                  maxLength: 200
                description:
                  type: string
                  minLength: 5
                editor_context:
                  $ref: '../schemas/work_management.yaml#/$defs/EditorContext'
                external_references:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Consultation recorded in OPEN state.
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      operationId: listConsultations
      tags: [Consultations]
      summary: List consultations within a workspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ConsultationStatus'
        - name: category
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/TriageCategory'
      responses:
        '200':
          description: List of consultations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/work_management.yaml#/$defs/Consultation'

  /v1/workspaces/{workspace_id}/consultations/{consultation_id}/triage:
    post:
      operationId: triageConsultation
      tags: [Triage]
      summary: Classify and triage an intake consultation
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, priority, triage_notes]
              properties:
                category:
                  $ref: '../schemas/work_management.yaml#/$defs/TriageCategory'
                priority:
                  $ref: '../schemas/work_management.yaml#/$defs/Priority'
                triage_notes:
                  type: string
                  minLength: 5
                bug_criteria:
                  $ref: '../schemas/work_management.yaml#/$defs/BugCriteria'
                feature_criteria:
                  $ref: '../schemas/work_management.yaml#/$defs/FeatureCriteria'
                chore_criteria:
                  $ref: '../schemas/work_management.yaml#/$defs/ChoreCriteria'
                docs_criteria:
                  $ref: '../schemas/work_management.yaml#/$defs/DocsCriteria'
                security_criteria:
                  $ref: '../schemas/work_management.yaml#/$defs/SecurityCriteria'
      responses:
        '200':
          description: Consultation triaged successfully.
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/workspaces/{workspace_id}/proposals:
    post:
      operationId: createProposal
      tags: [Proposals]
      summary: Draft a proposal derived from a triaged consultation
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consultation_id, title, technical_description, scope, justification, acceptance_criteria, category, priority]
              properties:
                consultation_id:
                  $ref: '../schemas/work_management.yaml#/$defs/UUID'
                title:
                  type: string
                  minLength: 5
                  maxLength: 200
                technical_description:
                  type: string
                  minLength: 10
                scope:
                  type: string
                  minLength: 5
                justification:
                  type: string
                  minLength: 5
                acceptance_criteria:
                  type: array
                  minItems: 1
                  items:
                    type: string
                category:
                  $ref: '../schemas/work_management.yaml#/$defs/TriageCategory'
                priority:
                  $ref: '../schemas/work_management.yaml#/$defs/Priority'
                estimated_hours:
                  type: number
                  minimum: 0.5
      responses:
        '201':
          description: Proposal created in DRAFT state. Does not create a WorkItem.
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/workspaces/{workspace_id}/proposals/{proposal_id}/submit:
    post:
      operationId: submitProposalForReview
      tags: [Proposals]
      summary: Submit a draft proposal for formal peer review
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Proposal transitioned to IN_REVIEW.
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Proposal'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/workspaces/{workspace_id}/proposals/{proposal_id}/decide:
    post:
      operationId: decideProposal
      tags: [Approvals]
      summary: Formally approve, reject, or request changes on a proposal
      description: >-
        Submits an approval decision. When decision is 'approved', atomically
        and idempotently generates the WorkItem and initial BoardCard.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposal_version, decision, decision_justification]
              properties:
                proposal_version:
                  type: integer
                  minimum: 1
                decision:
                  $ref: '../schemas/work_management.yaml#/$defs/ApprovalDecision'
                decision_justification:
                  type: string
                  minLength: 3
                target_board_id:
                  $ref: '../schemas/work_management.yaml#/$defs/UUID'
      responses:
        '200':
          description: Decision recorded. If approved, includes generated WorkItem and BoardCard.
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: '../schemas/work_management.yaml#/$defs/Approval'
                  work_item:
                    $ref: '../schemas/work_management.yaml#/$defs/WorkItem'
                  board_card:
                    $ref: '../schemas/work_management.yaml#/$defs/BoardCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Stale version, concurrent decision, or conflict.
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'

  /v1/workspaces/{workspace_id}/work-items:
    get:
      operationId: listWorkItems
      tags: [WorkItems]
      summary: List authorized work items
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/WorkItemStatus'
      responses:
        '200':
          description: List of active work items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/work_management.yaml#/$defs/WorkItem'

  /v1/workspaces/{workspace_id}/boards/{board_id}/cards:
    get:
      operationId: listBoardCards
      tags: [Boards]
      summary: List cards in a Kanban board
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: board_id
          in: path
          required: true
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/UUID'
      responses:
        '200':
          description: Cards grouped or ranked by column.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/work_management.yaml#/$defs/BoardCard'

    patch:
      operationId: moveBoardCard
      tags: [Boards]
      summary: Move card to another column or update its rank
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: board_id
          in: path
          required: true
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card_id, target_column_id, target_rank]
              properties:
                card_id:
                  $ref: '../schemas/work_management.yaml#/$defs/UUID'
                target_column_id:
                  type: string
                target_rank:
                  type: string
      responses:
        '200':
          description: Card position updated.
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/BoardCard'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  parameters:
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    ConsultationId:
      name: consultation_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128

  responses:
    BadRequest:
      description: Invalid request payload or parameter.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
    Forbidden:
      description: User lacks authorization or RBAC role for this action.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
    NotFound:
      description: Resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
    Conflict:
      description: Conflict due to optimistic locking, invalid state transition, or duplicate.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
