openapi: 3.1.0
info:
  title: EventFlow Work Management API
  version: 1.0.0
  description: >-
    Authoritative, versioned HTTP contract for Work Management (Consultations,
    Triage, Proposals, Approvals, WorkItems, and BoardCards). Shared by the
    Webapp, VS Code Extension, and Desktop Application clients. The public API
    version is carried in the `/v1/` URL prefix; breaking changes require a new
    prefix. Errors use RFC 9457 problem details
    (application/problem+json). Mutating operations that a client may retry
    accept an optional `Idempotency-Key`; the approval decision requires it.
    Authorization requirements are declared per operation through
    `x-required-roles` and must be enforced by the backend. See
    `docs/architecture/work-management-api.md` for the compatibility policy.
servers:
  - url: https://api.eventflow.invalid
    description: Planned Work Management Gateway / BFF endpoint
tags:
  - name: Consultations
  - name: Triage
  - name: Attachments
  - name: Comments
  - name: Evidence
  - name: History
  - name: Proposals
  - name: Approvals
  - name: WorkItems
  - name: Boards
  - name: SLA
  - name: Notifications
  - name: Project repositories
  - name: Workspaces
  - name: Projects
  - name: Members
  - name: Invitations
paths:
  /v1/workspaces/{workspace_id}/consultations:
    post:
      operationId: createConsultation
      tags: [Consultations]
      summary: Submit a new consultation (raw intake)
      description: >-
        Records a raw intake consultation in OPEN state. A consultation is not
        a task and never enters a board directly. Priority starts at medium until
        an authorized triage operation assigns the classified priority.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/CreateConsultationRequest'
      responses:
        '201':
          description: Consultation recorded in OPEN state.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              description: URI of the created consultation resource.
              schema:
                type: string
                format: uri-reference
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

    get:
      operationId: listConsultations
      tags: [Consultations]
      summary: List consultations within a workspace
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      x-allowed-sort-fields: [created_at, updated_at, priority, status]
      x-default-sort-fields: [created_at, consultation_id]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ConsultationStatus'
        - name: category
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/TriageCategory'
        - name: priority
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/Priority'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: A page of consultations.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/ConsultationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/consultations/triage-templates:
    get:
      operationId: listConsultationTriageTemplates
      tags: [Triage]
      summary: List reusable triage templates for the differentiated categories
      description: >-
        Returns backend-owned metadata describing the structured criteria each
        differentiated category (bug, feature, chore) requires. Templates are
        guidance only: the backend discriminated union remains authoritative and
        no template infers a category automatically.
      security:
        - bearerAuth: []
      x-required-roles: [triager, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The triage templates.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/TriageTemplates'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/consultations/drafts:
    post:
      operationId: createConsultationDraft
      tags: [Consultations]
      summary: Create a draft consultation
      description: >-
        Records a consultation in DRAFT state. A draft is an unsubmitted intake
        that cannot be triaged until it is submitted, which transitions it to
        OPEN. Drafts let offline-capable clients persist intake before submission.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/CreateConsultationRequest'
      responses:
        '201':
          description: Draft consultation created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              description: URI of the created consultation resource.
              schema:
                type: string
                format: uri-reference
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/consultations/{consultation_id}/triage:
    post:
      operationId: triageConsultation
      tags: [Triage]
      summary: Classify and triage an intake consultation
      security:
        - bearerAuth: []
      x-required-roles: [triager, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/TriageConsultationRequest'
      responses:
        '200':
          description: Consultation triaged successfully.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/consultations/{consultation_id}/reclassify:
    post:
      operationId: reclassifyConsultation
      tags: [Triage]
      summary: Manually reclassify an already-triaged consultation
      description: >-
        Replaces the category, priority, and criteria of a consultation that has
        already completed manual triage. Requires an explicit justification and
        is recorded in the append-only audit trail with the previous and new
        category and criteria snapshot. It never auto-classifies and never
        creates a Proposal, Approval, WorkItem, or BoardCard.
      security:
        - bearerAuth: []
      x-required-roles: [triager, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/ReclassifyConsultationRequest'
      responses:
        '200':
          description: Consultation reclassified successfully.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/consultations/{consultation_id}/submit:
    post:
      operationId: submitConsultationDraft
      tags: [Consultations]
      summary: Submit a draft consultation
      description: >-
        Transitions a DRAFT consultation to OPEN, making it eligible for triage.
        Only the draft author or a workspace administrator may submit it. An
        already-submitted consultation returns 409 Conflict.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Draft submitted and now in OPEN state.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/consultations/{consultation_id}:
    get:
      operationId: getConsultation
      tags: [Consultations]
      summary: Retrieve one consultation within a workspace
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The requested consultation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

    patch:
      operationId: updateConsultationDraft
      tags: [Consultations]
      summary: Edit a draft consultation
      description: >-
        Applies a partial update to a DRAFT consultation. Only the draft author
        or a workspace administrator may edit it, and only while it remains in
        DRAFT state; editing any other status returns 409 Conflict.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/UpdateConsultationDraftRequest'
      responses:
        '200':
          description: Draft consultation updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/consultations/{consultation_id}/attachments:
    post:
      operationId: createConsultationAttachment
      tags: [Attachments]
      summary: Upload a consultation attachment
      description: >-
        Accepts a base64-encoded object, validates its size, filename, and content
        type, scans it through the configured malware scanner, and records the
        outcome. An object that is not proven clean is quarantined or rejected and
        is never downloadable.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/CreateAttachmentRequest'
      responses:
        '201':
          description: Attachment recorded; its status reflects the scan verdict.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              description: URI of the created attachment resource.
              schema:
                type: string
                format: uri-reference
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/ConsultationAttachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

    get:
      operationId: listConsultationAttachments
      tags: [Attachments]
      summary: List a consultation's attachments
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The consultation's attachment metadata.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/ConsultationAttachmentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/consultations/{consultation_id}/attachments/{attachment_id}:
    get:
      operationId: getConsultationAttachment
      tags: [Attachments]
      summary: Read one attachment's metadata
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/AttachmentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Attachment metadata.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/ConsultationAttachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

    delete:
      operationId: deleteConsultationAttachment
      tags: [Attachments]
      summary: Delete an attachment and its stored object
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/AttachmentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Attachment metadata and object were removed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/consultations/{consultation_id}/attachments/{attachment_id}/content:
    get:
      operationId: downloadConsultationAttachment
      tags: [Attachments]
      summary: Download an available attachment's object
      description: >-
        Serves the stored object as an opaque download with a nosniff header. A
        quarantined or rejected attachment returns 409 and never exposes bytes.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/AttachmentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The attachment object as an opaque byte stream.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Content-Disposition:
              description: Forces the object to be saved rather than rendered.
              schema:
                type: string
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/consultations/{consultation_id}/evidence:
    post:
      operationId: createConsultationEvidence
      tags: [Evidence]
      summary: Add structured evidence to a consultation
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/CreateEvidenceRequest'
      responses:
        '201':
          description: Evidence recorded.
