        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/invitations/{invitation_id}/revoke:
    post:
      operationId: revokeInvitation
      tags: [Invitations]
      summary: Revoke a pending invitation
      security:
        - bearerAuth: []
      x-required-roles: [admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Invitation revoked.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/WorkspaceInvitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /v1/workspaces/{workspace_id}/invitations/{invitation_id}/accept:
    post:
      operationId: acceptInvitation
      tags: [Invitations]
      summary: Accept an invitation to join a workspace
      description: >-
        Identity-bound authorization: the authenticated principal must be the
        invited identity and present the exact one-time token. No existing
        workspace role is required, so the baseline viewer token denotes the
        authenticated tier. A wrong identity, workspace, or token, and a token
        that is already consumed or withdrawn, return 404; a still-pending but
        expired invitation returns 409.
      security:
        - bearerAuth: []
      x-required-roles: [viewer]
      x-authorization-scope: authenticated
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/AcceptInvitationRequest'
      responses:
        '201':
          description: Invitation accepted and membership created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/WorkspaceMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT validation and authorization must be enforced by the gateway. Required
        issuer, audience, algorithms, and claims remain deployment
        configuration; workspace membership and RBAC checks are server-side
        requirements. Issue #11 defines these requirements but implements no
        authentication or authorization runtime.

  schemas:
    Problem400:
      allOf:
        - $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
        - type: object
          properties:
            status:
              const: 400
    Problem401:
      allOf:
        - $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
        - type: object
          properties:
            status:
              const: 401
    Problem403:
      allOf:
        - $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
        - type: object
          properties:
            status:
              const: 403
    Problem404:
      allOf:
        - $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
        - type: object
          properties:
            status:
              const: 404
    Problem409:
      allOf:
        - $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
        - type: object
          properties:
            status:
              const: 409
    Problem412:
      allOf:
        - $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
        - type: object
          properties:
            status:
              const: 412
    Problem422:
      allOf:
        - $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
        - type: object
          properties:
            status:
              const: 422
    Problem503:
      allOf:
        - $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
        - type: object
          properties:
            status:
              const: 503

  parameters:
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    ConsultationId:
      name: consultation_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    MembershipId:
      name: membership_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    BoardId:
      name: board_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    BoardCardId:
      name: card_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: >-
        Existing business workflow identifier when applicable. The gateway
        generates one when absent, validates a supplied UUID, and returns the
        effective value in X-Correlation-ID.
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable client key for one approval-decision operation. The key namespace
        is (workspace_id, operationId, key), matching the persistence uniqueness
        scope. Within that namespace, an equivalent request replays the original
        HTTP status and body, including concurrent duplicates; a different
        request fingerprint returns 409. The same key in another workspace or
        operation is independent. This is a contract requirement, not a claim
        that an HTTP handler currently implements replay.
      x-idempotency-scope: [workspace_id, operationId]
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._~-]{8,128}$'
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional stable client key for a retryable operation. When supplied, the
        key namespace is (workspace_id, operationId, key). Within that namespace,
        an equivalent request replays the original HTTP status and body,
        including concurrent duplicates; a different request fingerprint
        returns 409. The same key in another workspace or operation is
        independent. This is a contract requirement, not a claim that an HTTP
        handler currently implements replay. Offline-capable clients must send
        it.
      x-idempotency-scope: [workspace_id, operationId]
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._~-]{8,128}$'
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as page_info.next_cursor by the previous page.
      x-cursor-binding: [workspace_id, operationId, filters, sort]
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Sort:
      name: sort
      in: query
      required: false
      description: >-
        Comma-separated sort keys; prefix a key with '-' for descending order.
        Allowed keys are listed per operation. Ordering is deterministic and
        keyset-based, with the resource identifier as a unique final tie-breaker.
        The contract does not promise snapshot isolation across pages.
      x-ordering: stable_keyset_with_resource_id_tiebreaker
      x-snapshot-isolation: false
      schema:
        type: string
        pattern: '^-?[a-z_]+(,-?[a-z_]+)*$'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        Optional strong ETag validator previously returned for this exact
        resource. Weak validators and wildcard/list forms are not accepted; a
        stale value yields 412 Precondition Failed.
      schema:
        type: string
        pattern: '^"[^"]+"$'

  headers:
    CorrelationId:
      description: Business workflow correlation identifier.
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    RequestId:
      description: Identifier for this HTTP request.
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    ETag:
      description: Opaque entity or collection version used for optimistic concurrency.
      schema:
        type: string
        pattern: '^"[^"]+"$'

  responses:
    BadRequest:
      description: Malformed request, invalid parameter, or validation failure.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem400'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem401'
    Forbidden:
      description: The principal is authenticated but lacks the required workspace role.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem403'
    NotFound:
      description: >-
        The resource does not exist or is not visible to the caller; existence
        of another workspace's resource is never disclosed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem404'
    Conflict:
      description: >-
        Optimistic-locking, idempotency, or invalid state-transition conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem409'
    PreconditionFailed:
      description: The If-Match precondition did not match the current entity version.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem412'
    UnprocessableEntity:
      description: The request is syntactically correct but semantically invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem422'
    ServiceUnavailable:
      description: A required authoritative dependency is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem503'
    UnexpectedError:
      description: >-
        Unexpected server failure. The response uses a sanitized problem body;
        a mutation must not expose internal details or leave a partial database
        effect.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
