openapi: 3.1.0
info:
  title: EventFlow Work Management API
  version: 1.0.0
  description: >-
    Authoritative, versioned HTTP contract for Work Management (Consultations,
    Triage, Proposals, Approvals, WorkItems, and BoardCards). Shared by the
    Webapp, VS Code Extension, and Desktop Application clients. The public API
    version is carried in the `/v1/` URL prefix; breaking changes require a new
    prefix. Errors use RFC 9457 problem details
    (application/problem+json). Mutating operations that a client may retry
    accept an optional `Idempotency-Key`; the approval decision requires it.
    Authorization requirements are declared per operation through
    `x-required-roles` and are enforced by the backend. See
    `docs/architecture/work-management-api.md` for the compatibility policy.
servers:
  - url: https://api.eventflow.invalid
    description: Planned Work Management Gateway / BFF endpoint
tags:
  - name: Consultations
  - name: Triage
  - name: Proposals
  - name: Approvals
  - name: WorkItems
  - name: Boards
paths:
  /v1/workspaces/{workspace_id}/consultations:
    post:
      operationId: createConsultation
      tags: [Consultations]
      summary: Submit a new consultation (raw intake)
      description: >-
        Records a raw intake consultation in OPEN state. A consultation is not
        a task and never enters a board directly.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/CreateConsultationRequest'
      responses:
        '201':
          description: Consultation recorded in OPEN state.
          headers:
            Location:
              description: URI of the created consultation resource.
              schema:
                type: string
                format: uri-reference
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      operationId: listConsultations
      tags: [Consultations]
      summary: List consultations within a workspace
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      x-allowed-sort-fields: [created_at, updated_at, priority, status]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ConsultationStatus'
        - name: category
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/TriageCategory'
        - name: priority
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/Priority'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: A page of consultations.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/ConsultationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/workspaces/{workspace_id}/consultations/{consultation_id}/triage:
    post:
      operationId: triageConsultation
      tags: [Triage]
      summary: Classify and triage an intake consultation
      security:
        - bearerAuth: []
      x-required-roles: [triager, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConsultationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/TriageConsultationRequest'
      responses:
        '200':
          description: Consultation triaged successfully.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Consultation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/workspaces/{workspace_id}/proposals:
    post:
      operationId: createProposal
      tags: [Proposals]
      summary: Draft a proposal derived from a triaged consultation
      description: >-
        Creates a proposal in DRAFT state. It does not create a WorkItem or
        allocate execution capacity.
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/CreateProposalRequest'
      responses:
        '201':
          description: Proposal created in DRAFT state. Does not create a WorkItem.
          headers:
            Location:
              description: URI of the created proposal resource.
              schema:
                type: string
                format: uri-reference
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/workspaces/{workspace_id}/proposals/{proposal_id}/submit:
    post:
      operationId: submitProposalForReview
      tags: [Proposals]
      summary: Submit a draft proposal for formal peer review
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Proposal transitioned to IN_REVIEW.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/workspaces/{workspace_id}/proposals/{proposal_id}/decide:
    post:
      operationId: decideProposal
      tags: [Approvals]
      summary: Formally approve, reject, or request changes on a proposal
      description: >-
        Submits an approval decision bound to an exact proposal version. When
        the decision is 'approved', the WorkItem and initial BoardCard are
        generated atomically and idempotently. The Idempotency-Key header is
        required and replay-safe.
      security:
        - bearerAuth: []
      x-required-roles: [approver, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ProposalId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/DecideProposalRequest'
      responses:
        '200':
          description: Decision recorded. If approved, includes generated WorkItem and BoardCard.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/DecideProposalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/workspaces/{workspace_id}/work-items:
    get:
      operationId: listWorkItems
      tags: [WorkItems]
      summary: List authorized work items
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      x-allowed-sort-fields: [created_at, updated_at, priority, status]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/WorkItemStatus'
        - name: category
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/TriageCategory'
        - name: priority
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/Priority'
        - name: assignee_id
          in: query
          required: false
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/UUID'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: A page of authorized work items.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/WorkItemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/workspaces/{workspace_id}/boards/{board_id}/cards:
    get:
      operationId: listBoardCards
      tags: [Boards]
      summary: List cards in a Kanban board
      security:
        - bearerAuth: []
      x-required-roles: [contributor, triager, approver, admin, owner, viewer]
      x-allowed-sort-fields: [rank, created_at, updated_at, priority]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - name: column_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: A page of board cards ranked by column.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/BoardCardPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    patch:
      operationId: moveBoardCard
      tags: [Boards]
      summary: Move card to another column or update its rank
      security:
        - bearerAuth: []
      x-required-roles: [contributor, admin, owner]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/work_management.yaml#/$defs/MoveBoardCardRequest'
      responses:
        '200':
          description: Card position updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '../schemas/work_management.yaml#/$defs/BoardCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT validation and authorization are enforced by the gateway. Required
        issuer, audience, algorithms, and claims remain deployment
        configuration; workspace membership and RBAC are checked server-side.

  parameters:
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    ConsultationId:
      name: consultation_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    BoardId:
      name: board_id
      in: path
      required: true
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: >-
        Existing business workflow identifier when applicable. The gateway
        generates one when absent, validates a supplied UUID, and returns the
        effective value in X-Correlation-ID.
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable client key for one approval decision. Repeating the same key with
        an equivalent request replays the stored response without repeating
        effects; reusing it with a different request is an idempotency conflict.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional stable client key for a retryable operation. When present,
        repeating the same key with an equivalent request replays the stored
        response; reusing it with a different request is an idempotency
        conflict. Offline-capable clients must send it.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as page_info.next_cursor by the previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Sort:
      name: sort
      in: query
      required: false
      description: >-
        Comma-separated sort keys; prefix a key with '-' for descending order.
        Allowed keys are listed per operation.
      schema:
        type: string
        pattern: '^-?[a-z_]+(,-?[a-z_]+)*$'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        Optimistic concurrency precondition carrying a previously returned ETag.
        A stale value yields 412 Precondition Failed.
      schema:
        type: string
        minLength: 1

  headers:
    CorrelationId:
      description: Business workflow correlation identifier.
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    RequestId:
      description: Identifier for this HTTP request.
      schema:
        $ref: '../schemas/work_management.yaml#/$defs/UUID'
    ETag:
      description: Opaque entity or collection version used for optimistic concurrency.
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request, invalid parameter, or validation failure.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
    Forbidden:
      description: The principal is authenticated but lacks the required workspace role.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
    NotFound:
      description: >-
        The resource does not exist or is not visible to the caller; existence
        of another workspace's resource is never disclosed.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
    Conflict:
      description: >-
        Optimistic-locking, idempotency, or invalid state-transition conflict.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
    PreconditionFailed:
      description: The If-Match precondition did not match the current entity version.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
    UnprocessableEntity:
      description: The request is syntactically correct but semantically invalid.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
    ServiceUnavailable:
      description: A required authoritative dependency is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/work_management.yaml#/$defs/ErrorResponse'
