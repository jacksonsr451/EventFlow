$schema: https://json-schema.org/draft/2020-12/schema
title: EventFlow HTTP schemas
type: object
$defs:
  CartLineView:
    type: object
    additionalProperties: true
    required: [sku, quantity, product, price, availability]
    properties:
      sku:
        type: string
        minLength: 1
      quantity:
        type: integer
        minimum: 1
      product:
        type: object
        additionalProperties: true
        required: [name, commercial_status]
        properties:
          name:
            type: [string, 'null']
          commercial_status:
            type: [string, 'null']
      price:
        oneOf:
          - $ref: 'common.yaml#/$defs/Money'
          - type: 'null'
      availability:
        type: string
        enum: [AVAILABLE, UNAVAILABLE, TEMPORARILY_UNAVAILABLE]
  CartView:
    type: object
    additionalProperties: true
    required: [cart_id, items]
    properties:
      cart_id:
        $ref: 'common.yaml#/$defs/UUID'
      items:
        type: array
        items:
          $ref: '#/$defs/CartLineView'
  CheckoutItem:
    type: object
    additionalProperties: false
    description: >-
      Client-provided checkout selection. The quote was issued by a server-side
      authority; Orders validates its ownership, SKU, quantity and validity.
    required: [sku, quantity, quote_id]
    properties:
      sku:
        type: string
        minLength: 1
      quantity:
        type: integer
        minimum: 1
      quote_id:
        $ref: 'common.yaml#/$defs/UUID'
  CheckoutRequest:
    type: object
    additionalProperties: false
    description: >-
      Quote acquisition is outside this API baseline. The submitted quote_id
      values must refer to server-controlled quotes and are never replaced by
      a client-submitted price or timestamp.
    required: [cart_id, items]
    properties:
      cart_id:
        $ref: 'common.yaml#/$defs/UUID'
      items:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/CheckoutItem'
  OrderResponse:
    $ref: 'common.yaml#/$defs/Order'
  CheckoutResponse:
    type: object
    additionalProperties: true
    required: [order, correlation_id]
    properties:
      order:
        $ref: 'common.yaml#/$defs/Order'
      correlation_id:
        $ref: 'common.yaml#/$defs/UUID'
  ErrorResponse:
    $ref: 'common.yaml#/$defs/Error'
