      response_minutes:
        anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
      resolution_minutes:
        anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
      timezone:
        type: string
        minLength: 1
        maxLength: 64
        default: UTC
      business_hours:
        type: object
        additionalProperties: true
      holidays:
        type: array
        items:
          type: string
          format: date
      pause_statuses:
        type: array
        items:
          $ref: '#/$defs/WorkItemStatus'
      warning_threshold_percent:
        type: integer
        minimum: 1
        maximum: 99
        default: 75
      activate:
        type: boolean
        default: false

  CreateSlaPolicyVersionRequest:
    type: object
    additionalProperties: false
    properties:
      response_minutes:
        anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
      resolution_minutes:
        anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
      timezone:
        anyOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
      business_hours:
        type: object
        additionalProperties: true
      holidays:
        type: array
        items:
          type: string
          format: date
      pause_statuses:
        type: array
        items:
          $ref: '#/$defs/WorkItemStatus'
      warning_threshold_percent:
        anyOf:
          - type: integer
            minimum: 1
            maximum: 99
          - type: 'null'
      activate:
