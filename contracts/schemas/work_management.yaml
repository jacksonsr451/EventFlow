$schema: https://json-schema.org/draft/2020-12/schema
$id: https://contracts.eventflow.invalid/schemas/work_management.yaml
title: EventFlow Work Management Schemas
description: Reusable data contracts for the Work Management domain (Consultations, Proposals, Approvals, WorkItems, and BoardCards).

$defs:
  UUID:
    type: string
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$

  RFC3339DateTime:
    type: string
    format: date-time

  Origin:
    type: string
    enum: [web, vscode, desktop, external]

  TriageCategory:
    type: string
    enum: [bug, feature, chore, docs, security]

  Priority:
    type: string
    enum: [critical, high, medium, low]

  ConsultationStatus:
    type: string
    enum: [open, triaging, proposed, duplicate, rejected, closed, reopened]

  ProposalStatus:
    type: string
    enum: [draft, in_review, approved, rejected, changes_requested, superseded]

  ApprovalDecision:
    type: string
    enum: [approved, rejected, changes_requested]

  WorkItemStatus:
    type: string
    enum: [ready, in_progress, in_review, blocked, done, cancelled]

  EditorContext:
    type: object
    required: [repository, branch, commit_sha, file_path, line_start, line_end, consent_granted]
    additionalProperties: false
    properties:
      repository:
        type: string
        minLength: 1
      branch:
        type: string
        minLength: 1
      commit_sha:
        type: string
        pattern: ^[0-9a-f]{7,40}$
      file_path:
        type: string
        minLength: 1
      line_start:
        type: integer
        minimum: 1
      line_end:
        type: integer
        minimum: 1
      selected_code_snippet:
        type: string
      consent_granted:
        type: boolean
        const: true

  BugCriteria:
    type: object
    required: [expected_behavior, observed_behavior, reproduction_steps, environment, severity, is_regression]
    additionalProperties: false
    properties:
      expected_behavior:
        type: string
        minLength: 5
      observed_behavior:
        type: string
        minLength: 5
      reproduction_steps:
        type: array
        minItems: 1
        items:
          type: string
      environment:
        type: string
        minLength: 1
      severity:
        $ref: '#/$defs/Priority'
      is_regression:
        type: boolean

  FeatureCriteria:
    type: object
    required: [problem_statement, expected_value, functional_requirements, acceptance_criteria]
    additionalProperties: false
    properties:
      problem_statement:
        type: string
        minLength: 10
      expected_value:
        type: string
        minLength: 10
      functional_requirements:
        type: array
        minItems: 1
        items:
          type: string
      acceptance_criteria:
        type: array
        minItems: 1
        items:
          type: string

  ChoreCriteria:
    type: object
    required: [maintenance_need, technical_debt_type, justification, risk_of_inaction]
    additionalProperties: false
    properties:
      maintenance_need:
        type: string
        minLength: 5
      technical_debt_type:
        type: string
        minLength: 3
      justification:
        type: string
        minLength: 5
      risk_of_inaction:
        type: string
        minLength: 5

  DocsCriteria:
    type: object
    required: [affected_document, inconsistency_summary, target_audience]
    additionalProperties: false
    properties:
      affected_document:
        type: string
        minLength: 3
      inconsistency_summary:
        type: string
        minLength: 5
      target_audience:
        type: string
        minLength: 3

  SecurityCriteria:
    type: object
    required: [vulnerability_type, severity_rating, confidentiality_level, access_restricted_to, safe_evidence_handling]
    additionalProperties: false
    properties:
      vulnerability_type:
        type: string
        minLength: 3
      severity_rating:
        $ref: '#/$defs/Priority'
      confidentiality_level:
        type: string
        enum: [confidential, restricted]
      access_restricted_to:
        type: array
        minItems: 1
        items:
          type: string
      safe_evidence_handling:
        type: boolean
        const: true

  Workspace:
    type: object
    description: Tenant boundary. Every Work Management row is scoped to exactly one workspace.
    required: [workspace_id, name, slug, created_at, updated_at]
    additionalProperties: false
    properties:
      workspace_id:
        $ref: '#/$defs/UUID'
      name:
        type: string
        minLength: 3
        maxLength: 120
      slug:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        maxLength: 80
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  Project:
    type: object
    description: A unit of work grouping inside a workspace.
    required: [project_id, workspace_id, key, name, created_at, updated_at]
    additionalProperties: false
    properties:
      project_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      key:
        type: string
        pattern: ^[A-Z][A-Z0-9]{1,9}$
      name:
        type: string
        minLength: 3
        maxLength: 120
      description:
        type: string
        minLength: 1
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  Consultation:
    type: object
    required: [consultation_id, workspace_id, project_id, author_id, origin, title, description, status, priority, created_at, updated_at]
    additionalProperties: false
    properties:
      consultation_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      project_id:
        $ref: '#/$defs/UUID'
      author_id:
        $ref: '#/$defs/UUID'
      assignee_id:
        $ref: '#/$defs/UUID'
      origin:
        $ref: '#/$defs/Origin'
      title:
        type: string
        minLength: 3
        maxLength: 200
      description:
        type: string
        minLength: 5
      category:
        $ref: '#/$defs/TriageCategory'
      status:
        $ref: '#/$defs/ConsultationStatus'
      priority:
        $ref: '#/$defs/Priority'
      editor_context:
        $ref: '#/$defs/EditorContext'
      external_references:
        type: array
        items:
          type: string
      active_proposal_id:
        $ref: '#/$defs/UUID'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  Proposal:
    type: object
    required: [proposal_id, consultation_id, workspace_id, project_id, version, title, technical_description, scope, justification, acceptance_criteria, category, priority, status, proposer_id, created_at, updated_at]
    additionalProperties: false
    properties:
      proposal_id:
        $ref: '#/$defs/UUID'
      consultation_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      project_id:
        $ref: '#/$defs/UUID'
      version:
        type: integer
        minimum: 1
      title:
        type: string
        minLength: 5
        maxLength: 200
      technical_description:
        type: string
        minLength: 10
      scope:
        type: string
        minLength: 5
      justification:
        type: string
        minLength: 5
      acceptance_criteria:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 3
      category:
        $ref: '#/$defs/TriageCategory'
      priority:
        $ref: '#/$defs/Priority'
      risks:
        type: array
        items:
          type: string
      dependencies:
        type: array
        items:
          type: string
      estimated_hours:
        type: number
        minimum: 0.5
      status:
        $ref: '#/$defs/ProposalStatus'
      proposer_id:
        $ref: '#/$defs/UUID'
      reviewer_id:
        $ref: '#/$defs/UUID'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  Approval:
    type: object
    required: [approval_id, proposal_id, proposal_version, workspace_id, decider_id, decision, decision_justification, idempotency_key, decided_at, audit_snapshot_hash]
    additionalProperties: false
    properties:
      approval_id:
        $ref: '#/$defs/UUID'
      proposal_id:
        $ref: '#/$defs/UUID'
      proposal_version:
        type: integer
        minimum: 1
      workspace_id:
        $ref: '#/$defs/UUID'
      decider_id:
        $ref: '#/$defs/UUID'
      decision:
        $ref: '#/$defs/ApprovalDecision'
      decision_justification:
        type: string
        minLength: 3
      idempotency_key:
        type: string
        minLength: 8
        maxLength: 128
      decided_at:
        $ref: '#/$defs/RFC3339DateTime'
      audit_snapshot_hash:
        type: string
        pattern: ^[0-9a-f]{64}$

  WorkItem:
    type: object
    required: [work_item_id, workspace_id, project_id, origin_proposal_id, origin_proposal_version, origin_approval_id, title, description, acceptance_criteria, category, priority, status, created_at, updated_at]
    additionalProperties: false
    properties:
      work_item_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      project_id:
        $ref: '#/$defs/UUID'
      origin_proposal_id:
        $ref: '#/$defs/UUID'
      origin_proposal_version:
        type: integer
        minimum: 1
      origin_approval_id:
        $ref: '#/$defs/UUID'
      title:
        type: string
        minLength: 5
        maxLength: 200
      description:
        type: string
        minLength: 10
      acceptance_criteria:
        type: array
        minItems: 1
        items:
          type: string
      category:
        $ref: '#/$defs/TriageCategory'
      priority:
        $ref: '#/$defs/Priority'
      status:
        $ref: '#/$defs/WorkItemStatus'
      assignee_id:
        $ref: '#/$defs/UUID'
      external_issue_links:
        type: array
        items:
          type: string
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  BoardCard:
    type: object
    required: [card_id, workspace_id, board_id, column_id, work_item_id, rank, title, priority, category, created_at, updated_at]
    additionalProperties: false
    properties:
      card_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      board_id:
        $ref: '#/$defs/UUID'
      column_id:
        type: string
        minLength: 1
      work_item_id:
        $ref: '#/$defs/UUID'
      rank:
        type: string
        pattern: ^[0-9a-zA-Z_-]+$
      title:
        type: string
        minLength: 3
        maxLength: 200
      priority:
        $ref: '#/$defs/Priority'
      category:
        $ref: '#/$defs/TriageCategory'
      assignee_id:
        $ref: '#/$defs/UUID'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  Board:
    type: object
    description: An ordered set of columns that groups board cards for a project.
    required: [board_id, workspace_id, project_id, name, columns, created_at, updated_at]
    additionalProperties: false
    properties:
      board_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      project_id:
        $ref: '#/$defs/UUID'
      name:
        type: string
        minLength: 1
        maxLength: 120
      columns:
        type: array
        items:
          type: string
          minLength: 1
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  AuditRecord:
    type: object
    description: Append-only record of a Work Management state change.
    required: [audit_id, workspace_id, action, entity_type, entity_id, occurred_at, snapshot_hash]
    additionalProperties: false
    properties:
      audit_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      actor_id:
        $ref: '#/$defs/UUID'
      action:
        type: string
        minLength: 3
        maxLength: 120
      entity_type:
        type: string
        minLength: 3
        maxLength: 80
      entity_id:
        $ref: '#/$defs/UUID'
      occurred_at:
        $ref: '#/$defs/RFC3339DateTime'
      snapshot:
        type: object
      snapshot_hash:
        type: string
        pattern: ^[0-9a-f]{64}$
      correlation_id:
        $ref: '#/$defs/UUID'

  RemoteIntegrationReference:
    type: object
    description: Maps a Work Management entity to an external GitHub/GitLab resource.
    required: [reference_id, workspace_id, provider, installation_id, remote_resource_type, remote_resource_id, entity_type, entity_id, created_at]
    additionalProperties: false
    properties:
      reference_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      provider:
        type: string
        enum: [github, gitlab]
      installation_id:
        type: string
        minLength: 1
        maxLength: 120
      remote_resource_type:
        type: string
        enum: [issue, pull_request, merge_request]
      remote_resource_id:
        type: string
        minLength: 1
        maxLength: 120
      entity_type:
        type: string
        minLength: 3
        maxLength: 80
      entity_id:
        $ref: '#/$defs/UUID'
      url:
        type: string
        minLength: 1
        maxLength: 500
      created_at:
        $ref: '#/$defs/RFC3339DateTime'

  ErrorResponse:
    type: object
    required: [error_code, message, timestamp]
    additionalProperties: false
    properties:
      error_code:
        type: string
        minLength: 3
      message:
        type: string
        minLength: 3
      details:
        type: object
      timestamp:
        $ref: '#/$defs/RFC3339DateTime'
