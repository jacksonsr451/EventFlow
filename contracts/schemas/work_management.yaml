$schema: https://json-schema.org/draft/2020-12/schema
$id: https://contracts.eventflow.invalid/schemas/work_management.yaml
title: EventFlow Work Management Schemas
description: Reusable data contracts for the Work Management domain (Consultations, Proposals, Approvals, WorkItems, and BoardCards).

$defs:
  UUID:
    type: string
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$

  RFC3339DateTime:
    type: string
    format: date-time

  Origin:
    type: string
    enum: [web, vscode, desktop, external]

  TriageCategory:
    type: string
    enum: [bug, feature, chore, docs, security]

  Priority:
    type: string
    enum: [critical, high, medium, low]

  ConsultationStatus:
    type: string
    enum: [draft, open, triaging, proposed, duplicate, rejected, closed, reopened]

  ProposalStatus:
    type: string
    enum: [draft, in_review, approved, rejected, changes_requested, superseded]

  ChecklistItem:
    type: object
    description: A single reviewable checklist entry on a proposal.
    additionalProperties: false
    required: [item_id, text, done]
    properties:
      item_id:
        $ref: '#/$defs/UUID'
      text:
        type: string
        minLength: 1
        maxLength: 200
      done:
        type: boolean

  ApprovalDecision:
    type: string
    enum: [approved, rejected, changes_requested]

  WorkItemStatus:
    type: string
    enum: [ready, in_progress, in_review, blocked, done, cancelled]

  AttachmentStatus:
    type: string
    description: >-
      Fail-closed attachment lifecycle. An upload starts quarantined and only
      becomes available after an approved scanner returns a clean verdict.
    enum: [quarantined, available, rejected]

  AttachmentScanVerdict:
    type: string
    enum: [clean, infected, unknown]

  EvidenceKind:
    type: string
    enum: [text, link, attachment]

  Role:
    type: string
    description: >-
      Workspace RBAC role vocabulary used by the public API authorization
      requirements. The authoritative definition and enforcement are owned by
      Issue #9; this contract only names the roles an operation requires.
    enum: [owner, admin, triager, approver, contributor, viewer]

  EntityCollection:
    type: string
    description: >-
      Public path segment identifying the entity a comment or history entry
      belongs to. Each segment maps to one canonical ``entity_type``.
    enum: [consultations, proposals, work-items, board-cards]

  AttachmentEntityCollection:
    type: string
    description: >-
      Public path segment for generic attachments. Consultations keep their
      dedicated Issue #4 attachment routes and are not valid here.
    enum: [proposals, work-items, board-cards]

  EntityType:
    type: string
    description: Canonical entity discriminator persisted with a comment or attachment.
    enum: [consultation, proposal, work_item, board_card]

  EditorContext:
    type: object
    required: [repository, branch, commit_sha, file_path, line_start, line_end, consent_granted]
    additionalProperties: false
    properties:
      repository:
        type: string
        minLength: 1
      branch:
        type: string
        minLength: 1
      commit_sha:
        type: string
        pattern: ^[0-9a-f]{7,40}$
      file_path:
        type: string
        minLength: 1
      line_start:
        type: integer
        minimum: 1
      line_end:
        type: integer
        minimum: 1
      selected_code_snippet:
        type: string
      consent_granted:
        type: boolean
        const: true

  BugCriteria:
    type: object
    required: [expected_behavior, observed_behavior, reproduction_steps, environment, severity, is_regression, impact]
    additionalProperties: false
    properties:
      expected_behavior:
        type: string
        minLength: 5
      observed_behavior:
        type: string
        minLength: 5
      reproduction_steps:
        type: array
        minItems: 1
        items:
          type: string
      environment:
        type: string
        minLength: 1
      severity:
        $ref: '#/$defs/Priority'
      is_regression:
        type: boolean
      impact:
        type: string
        minLength: 5

  FeatureCriteria:
    type: object
    required: [problem_statement, expected_value, functional_requirements, acceptance_criteria, scope]
    additionalProperties: false
    properties:
      problem_statement:
        type: string
        minLength: 10
      expected_value:
        type: string
        minLength: 10
      functional_requirements:
        type: array
        minItems: 1
        items:
          type: string
      acceptance_criteria:
        type: array
        minItems: 1
        items:
          type: string
      scope:
        type: string
        minLength: 5

  ChoreCriteria:
    type: object
    required: [maintenance_need, technical_debt_type, justification, risk_of_inaction, expected_technical_effect]
    additionalProperties: false
    properties:
      maintenance_need:
        type: string
        minLength: 5
      technical_debt_type:
        type: string
        minLength: 3
      justification:
        type: string
        minLength: 5
      risk_of_inaction:
        type: string
        minLength: 5
      expected_technical_effect:
        type: string
        minLength: 5

  DocsCriteria:
    type: object
    required: [affected_document, inconsistency_summary, target_audience]
    additionalProperties: false
    properties:
      affected_document:
        type: string
        minLength: 3
      inconsistency_summary:
        type: string
        minLength: 5
      target_audience:
        type: string
        minLength: 3

  SecurityCriteria:
    type: object
    required: [vulnerability_type, severity_rating, confidentiality_level, access_restricted_to, safe_evidence_handling]
    additionalProperties: false
    properties:
      vulnerability_type:
        type: string
        minLength: 3
      severity_rating:
        $ref: '#/$defs/Priority'
      confidentiality_level:
        type: string
        enum: [confidential, restricted]
      access_restricted_to:
        type: array
        minItems: 1
        items:
          type: string
      safe_evidence_handling:
        type: boolean
        const: true

  Workspace:
    type: object
    description: Tenant boundary. Every Work Management row is scoped to exactly one workspace.
    required: [workspace_id, name, slug, created_at, updated_at]
    additionalProperties: false
    properties:
      workspace_id:
        $ref: '#/$defs/UUID'
      name:
        type: string
        minLength: 3
        maxLength: 120
      slug:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        maxLength: 80
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  Project:
    type: object
    description: A unit of work grouping inside a workspace.
    required: [project_id, workspace_id, key, name, created_at, updated_at]
    additionalProperties: false
    properties:
      project_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      key:
        type: string
        pattern: ^[A-Z][A-Z0-9]{1,9}$
      name:
        type: string
        minLength: 3
        maxLength: 120
      description:
        anyOf:
          - type: string
            minLength: 1
          - type: 'null'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  Consultation:
    type: object
    required: [consultation_id, workspace_id, project_id, author_id, origin, title, description, status, priority, created_at, updated_at]
    additionalProperties: false
    properties:
      consultation_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      project_id:
        $ref: '#/$defs/UUID'
      author_id:
        $ref: '#/$defs/UUID'
      assignee_id:
        anyOf:
          - $ref: '#/$defs/UUID'
          - type: 'null'
      origin:
        $ref: '#/$defs/Origin'
      title:
        type: string
        minLength: 3
        maxLength: 200
      description:
        type: string
        minLength: 5
      category:
        anyOf:
          - $ref: '#/$defs/TriageCategory'
          - type: 'null'
      status:
        $ref: '#/$defs/ConsultationStatus'
      priority:
        $ref: '#/$defs/Priority'
      business_impact:
        anyOf:
          - $ref: '#/$defs/BusinessImpact'
          - type: 'null'
        description: Optional business-impact classification used by the single priority matrix.
      business_urgency:
        anyOf:
          - $ref: '#/$defs/BusinessUrgency'
          - type: 'null'
        description: Optional business-urgency classification used by the single priority matrix.
      priority_override_reason:
        type: [string, 'null']
        minLength: 10
        maxLength: 300
        description: Required when the classified priority differs from the matrix result.
      editor_context:
        anyOf:
          - $ref: '#/$defs/EditorContext'
          - type: 'null'
      external_references:
        type: array
        items:
          type: string
      active_proposal_id:
        anyOf:
          - $ref: '#/$defs/UUID'
          - type: 'null'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  Proposal:
    type: object
    required: [proposal_id, consultation_id, workspace_id, project_id, version, title, technical_description, scope, justification, acceptance_criteria, checklist, category, priority, evidence, status, proposer_id, created_at, updated_at]
    additionalProperties: false
    properties:
      proposal_id:
        $ref: '#/$defs/UUID'
      consultation_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      project_id:
        $ref: '#/$defs/UUID'
      version:
        type: integer
        minimum: 1
        description: >-
          Revision number scoped to this proposal_id. Independent proposals of
          the same consultation each start at 1.
      title:
        type: string
        minLength: 5
        maxLength: 200
      technical_description:
        type: string
        minLength: 10
      scope:
        type: string
        minLength: 5
      justification:
        type: string
        minLength: 5
      acceptance_criteria:
        type: array
        minItems: 1
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 500
      checklist:
        type: array
        maxItems: 100
        items:
          $ref: '#/$defs/ChecklistItem'
      category:
        $ref: '#/$defs/TriageCategory'
      priority:
        $ref: '#/$defs/Priority'
      risks:
        type: array
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 500
      dependencies:
        type: array
        maxItems: 50
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 200
      evidence:
        type: array
        maxItems: 50
        uniqueItems: true
        description: Consultation evidence identifiers cited by this proposal.
        items:
          $ref: '#/$defs/UUID'
      estimated_hours:
        anyOf:
          - type: number
            minimum: 0.5
            maximum: 9999.99
          - type: 'null'
      status:
        $ref: '#/$defs/ProposalStatus'
      proposer_id:
        $ref: '#/$defs/UUID'
      reviewer_id:
        anyOf:
          - $ref: '#/$defs/UUID'
          - type: 'null'
      duplicated_from_proposal_id:
        anyOf:
          - $ref: '#/$defs/UUID'
          - type: 'null'
      superseded_by_proposal_id:
        anyOf:
          - $ref: '#/$defs/UUID'
          - type: 'null'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  Approval:
    type: object
    required: [approval_id, proposal_id, proposal_version, workspace_id, decider_id, decision, decision_justification, idempotency_key, decided_at, audit_snapshot_hash]
    additionalProperties: false
    properties:
      approval_id:
        $ref: '#/$defs/UUID'
      proposal_id:
        $ref: '#/$defs/UUID'
      proposal_version:
        type: integer
        minimum: 1
      workspace_id:
        $ref: '#/$defs/UUID'
      decider_id:
        $ref: '#/$defs/UUID'
      decision:
        $ref: '#/$defs/ApprovalDecision'
      decision_justification:
        type: string
        minLength: 3
      idempotency_key:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._~-]{8,128}$'
      decided_at:
        $ref: '#/$defs/RFC3339DateTime'
      audit_snapshot_hash:
        type: string
        pattern: ^[0-9a-f]{64}$

  WorkItem:
    type: object
    required: [work_item_id, workspace_id, project_id, origin_proposal_id, origin_proposal_version, origin_approval_id, title, description, acceptance_criteria, category, priority, status, created_at, updated_at]
    additionalProperties: false
    properties:
      work_item_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      project_id:
        $ref: '#/$defs/UUID'
      origin_proposal_id:
        $ref: '#/$defs/UUID'
      origin_proposal_version:
        type: integer
        minimum: 1
      origin_approval_id:
        $ref: '#/$defs/UUID'
      title:
        type: string
        minLength: 5
        maxLength: 200
      description:
        type: string
        minLength: 10
      acceptance_criteria:
        type: array
        minItems: 1
        items:
          type: string
      category:
        $ref: '#/$defs/TriageCategory'
      priority:
        $ref: '#/$defs/Priority'
      status:
        $ref: '#/$defs/WorkItemStatus'
      assignee_id:
        anyOf:
          - $ref: '#/$defs/UUID'
          - type: 'null'
      external_issue_links:
        type: array
        items:
          type: string
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  BoardCard:
    type: object
    required: [card_id, workspace_id, board_id, column_id, work_item_id, rank, title, priority, category, created_at, updated_at]
    additionalProperties: false
    properties:
      card_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      board_id:
        $ref: '#/$defs/UUID'
      column_id:
        type: string
        minLength: 1
        maxLength: 80
      work_item_id:
        $ref: '#/$defs/UUID'
      rank:
        type: string
        description: >-
          Opaque ordering key. Its character set and 64-character maximum match
          the Work Management persistence constraint.
        minLength: 1
        maxLength: 64
        pattern: '^[0-9a-zA-Z_-]+$'
      title:
        type: string
        minLength: 3
        maxLength: 200
      priority:
        $ref: '#/$defs/Priority'
      category:
        $ref: '#/$defs/TriageCategory'
      assignee_id:
        anyOf:
          - $ref: '#/$defs/UUID'
          - type: 'null'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  Board:
    type: object
    description: An ordered set of columns that groups board cards for a project.
    required: [board_id, workspace_id, project_id, name, columns, created_at, updated_at]
    additionalProperties: false
    properties:
      board_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      project_id:
        $ref: '#/$defs/UUID'
      name:
        type: string
        minLength: 1
        maxLength: 120
      columns:
        type: array
        items:
          type: string
          minLength: 1
      version:
        type: integer
        minimum: 1
        description: Optimistic-concurrency version of the board metadata.
      archived_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
        description: When the board was archived; null while active.
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  BoardColumn:
    type: object
    description: >-
      An independently managed, ordered column definition on a board. Its stable
      key is the identifier referenced by BoardCard.column_id; mapped_status binds
      the column to a canonical WorkItem status and wip_limit bounds its occupancy.
    required: [column_id, workspace_id, project_id, board_id, key, name, position, mapped_status, created_at, updated_at]
    additionalProperties: false
    properties:
      column_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      project_id:
        $ref: '#/$defs/UUID'
      board_id:
        $ref: '#/$defs/UUID'
      key:
        type: string
        minLength: 1
        maxLength: 80
        pattern: '^[a-z0-9][a-z0-9_-]{0,79}$'
      name:
        type: string
        minLength: 1
        maxLength: 120
      position:
        type: integer
        minimum: 0
      mapped_status:
        $ref: '#/$defs/WorkItemStatus'
      wip_limit:
        anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  CardMovement:
    type: object
    description: Append-only record of one board-card move.
    required: [movement_id, workspace_id, project_id, board_id, card_id, to_column_id, to_rank, to_status, occurred_at, created_at]
    additionalProperties: false
    properties:
      movement_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      project_id:
        $ref: '#/$defs/UUID'
      board_id:
        $ref: '#/$defs/UUID'
      card_id:
        $ref: '#/$defs/UUID'
      from_column_id:
        anyOf:
          - type: string
            minLength: 1
          - type: 'null'
      to_column_id:
        type: string
        minLength: 1
        maxLength: 80
      from_rank:
        anyOf:
          - type: string
            minLength: 1
            pattern: '^[0-9a-zA-Z_-]+$'
          - type: 'null'
      to_rank:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[0-9a-zA-Z_-]+$'
      from_status:
        anyOf:
          - $ref: '#/$defs/WorkItemStatus'
          - type: 'null'
      to_status:
        $ref: '#/$defs/WorkItemStatus'
      actor_id:
        anyOf:
          - $ref: '#/$defs/UUID'
          - type: 'null'
      correlation_id:
        anyOf:
          - $ref: '#/$defs/UUID'
          - type: 'null'
      occurred_at:
        $ref: '#/$defs/RFC3339DateTime'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'

  AuditRecord:
    type: object
    description: Append-only record of a Work Management state change.
    required: [audit_id, workspace_id, action, entity_type, entity_id, occurred_at, snapshot_hash]
    additionalProperties: false
    properties:
      audit_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      actor_id:
        $ref: '#/$defs/UUID'
      action:
        type: string
        minLength: 3
        maxLength: 120
      entity_type:
        type: string
        minLength: 3
        maxLength: 80
      entity_id:
        $ref: '#/$defs/UUID'
      occurred_at:
        $ref: '#/$defs/RFC3339DateTime'
      snapshot:
        type: object
      snapshot_hash:
        type: string
        pattern: ^[0-9a-f]{64}$
      correlation_id:
        $ref: '#/$defs/UUID'

  RemoteIntegrationReference:
    type: object
    description: Maps a Work Management entity to an external GitHub/GitLab resource.
    required: [reference_id, workspace_id, provider, installation_id, remote_resource_type, remote_resource_id, entity_type, entity_id, created_at]
    additionalProperties: false
    properties:
      reference_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      provider:
        type: string
        enum: [github, gitlab]
      installation_id:
        type: string
        minLength: 1
        maxLength: 120
      remote_resource_type:
        type: string
        enum: [issue, pull_request, merge_request]
      remote_resource_id:
        type: string
        minLength: 1
        maxLength: 120
      entity_type:
        type: string
        minLength: 3
        maxLength: 80
      entity_id:
        $ref: '#/$defs/UUID'
      url:
        type: string
        minLength: 1
        maxLength: 500
      created_at:
        $ref: '#/$defs/RFC3339DateTime'

  CreateConsultationRequest:
    type: object
    description: Request DTO for POST /v1/workspaces/{workspace_id}/consultations.
    additionalProperties: false
    required: [project_id, origin, title, description]
    properties:
      project_id:
        $ref: '#/$defs/UUID'
      origin:
        $ref: '#/$defs/Origin'
      title:
        type: string
        minLength: 3
        maxLength: 200
      description:
        type: string
        minLength: 5
      category:
        anyOf:
          - $ref: '#/$defs/TriageCategory'
          - type: 'null'
        description: >-
          Optional reporter-supplied type hint captured at intake. It is a
          provisional classification, not a triage decision; an authorized
          triage operation may confirm or override it.
      editor_context:
        $ref: '#/$defs/EditorContext'
      external_references:
        type: array
        items:
          type: string

  UpdateConsultationDraftRequest:
    type: object
    description: Request DTO for PATCH /v1/workspaces/{workspace_id}/consultations/{consultation_id}.
    additionalProperties: false
    minProperties: 1
    properties:
      project_id:
        $ref: '#/$defs/UUID'
      origin:
        $ref: '#/$defs/Origin'
      title:
        type: string
        minLength: 3
        maxLength: 200
      description:
        type: string
        minLength: 5
      category:
        anyOf:
          - $ref: '#/$defs/TriageCategory'
          - type: 'null'
      editor_context:
        anyOf:
          - $ref: '#/$defs/EditorContext'
          - type: 'null'
      external_references:
        type: array
        items:
          type: string

  ConsultationAttachment:
    type: object
    description: >-
      Metadata for one uploaded consultation attachment. Object bytes are never
      inlined in a response; content is served separately as an opaque download.
    additionalProperties: false
    required: [attachment_id, workspace_id, consultation_id, file_name, content_type, size_bytes, checksum_sha256, status, scan_verdict, uploaded_by, created_at]
    properties:
      attachment_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      consultation_id:
        $ref: '#/$defs/UUID'
      file_name:
        type: string
        minLength: 1
        maxLength: 255
      content_type:
        type: string
        minLength: 1
        maxLength: 255
        description: The detected content type, which must match the declared type.
      size_bytes:
        type: integer
        minimum: 0
        maximum: 5242880
      checksum_sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
      status:
        $ref: '#/$defs/AttachmentStatus'
      scan_verdict:
        $ref: '#/$defs/AttachmentScanVerdict'
      rejection_reason:
        anyOf:
          - type: string
            minLength: 1
            maxLength: 120
          - type: 'null'
      uploaded_by:
        $ref: '#/$defs/UUID'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'

  CreateAttachmentRequest:
    type: object
    description: >-
      Request DTO for POST .../attachments. Bytes are base64 encoded so the upload
      reuses the authenticated JSON transport; the server enforces the decoded
      size limit and the content-type allowlist.
    additionalProperties: false
    required: [file_name, content_type, content_base64]
    properties:
      file_name:
        type: string
        minLength: 1
        maxLength: 255
      content_type:
        type: string
        minLength: 1
        maxLength: 255
      content_base64:
        type: string
        minLength: 1
        maxLength: 8388608

  ConsultationAttachmentList:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/ConsultationAttachment'

  ConsultationEvidence:
    type: object
    description: One structured piece of evidence attached to a consultation.
    additionalProperties: false
    required: [evidence_id, workspace_id, consultation_id, kind, created_by, created_at]
    properties:
      evidence_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      consultation_id:
        $ref: '#/$defs/UUID'
      kind:
        $ref: '#/$defs/EvidenceKind'
      description:
        anyOf:
          - type: string
            minLength: 1
            maxLength: 500
          - type: 'null'
      content:
        anyOf:
          - type: string
            minLength: 1
            maxLength: 4096
          - type: 'null'
      attachment_id:
        anyOf:
          - $ref: '#/$defs/UUID'
          - type: 'null'
      created_by:
        $ref: '#/$defs/UUID'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'

  CreateEvidenceRequest:
    type: object
    description: Request DTO for POST .../evidence.
    additionalProperties: false
    required: [kind]
    properties:
      kind:
        $ref: '#/$defs/EvidenceKind'
      description:
        type: string
        minLength: 1
        maxLength: 500
      content:
        type: string
        minLength: 1
        maxLength: 4096
      attachment_id:
        $ref: '#/$defs/UUID'
    allOf:
      - if:
          properties:
            kind:
              const: attachment
          required: [kind]
        then:
          required: [attachment_id]
          not:
            required: [content]
      - if:
          properties:
            kind:
              enum: [text, link]
          required: [kind]
        then:
          required: [content]
          not:
            required: [attachment_id]

  ConsultationEvidenceList:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/ConsultationEvidence'

  ConsultationHistoryEntry:
    type: object
    description: One append-only lifecycle event in a consultation timeline.
    additionalProperties: false
    required: [audit_id, workspace_id, action, entity_type, entity_id, occurred_at, snapshot_hash]
    properties:
      audit_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      actor_id:
        anyOf:
          - $ref: '#/$defs/UUID'
          - type: 'null'
      action:
        type: string
        minLength: 3
        maxLength: 120
      entity_type:
        type: string
        minLength: 3
        maxLength: 80
      entity_id:
        $ref: '#/$defs/UUID'
      occurred_at:
        $ref: '#/$defs/RFC3339DateTime'
      snapshot:
        anyOf:
          - type: object
          - type: 'null'
      snapshot_hash:
        type: string
        pattern: ^[0-9a-f]{64}$
      correlation_id:
        anyOf:
          - $ref: '#/$defs/UUID'
          - type: 'null'

  ConsultationHistoryPage:
    type: object
    additionalProperties: false
    required: [items, page_info]
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/ConsultationHistoryEntry'
      page_info:
        $ref: '#/$defs/PageInfo'

  EntityComment:
    type: object
    description: >-
      One collaborative comment. A deleted comment is a tombstone: the row and
      its audit record remain, ``deleted`` is true, and ``body`` is null.
    additionalProperties: false
    required: [comment_id, workspace_id, project_id, entity_type, entity_id, author_id, body, deleted, created_at]
    properties:
      comment_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      project_id:
        $ref: '#/$defs/UUID'
      entity_type:
        $ref: '#/$defs/EntityType'
      entity_id:
        $ref: '#/$defs/UUID'
      author_id:
        $ref: '#/$defs/UUID'
      body:
        anyOf:
          - type: string
            minLength: 1
            maxLength: 4000
          - type: 'null'
        description: Null only for a deleted tombstone.
      deleted:
        type: boolean
      deleted_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'

  CreateEntityCommentRequest:
    type: object
    description: Request DTO for POST .../comments.
    additionalProperties: false
    required: [body]
    properties:
      body:
        type: string
        minLength: 1
        maxLength: 4000

  EntityCommentPage:
    type: object
    additionalProperties: false
    required: [items, page_info]
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/EntityComment'
      page_info:
        $ref: '#/$defs/PageInfo'

  EntityAttachment:
    type: object
    description: >-
      Metadata for one attachment on a proposal, work item, or board card.
      Consultation attachments keep their original resource shape. Object bytes
      are never inlined; a quarantined or rejected object is never downloadable.
    additionalProperties: false
    required: [attachment_id, workspace_id, project_id, entity_type, entity_id, file_name, content_type, size_bytes, checksum_sha256, status, scan_verdict, uploaded_by, created_at]
    properties:
      attachment_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      project_id:
        $ref: '#/$defs/UUID'
      entity_type:
        $ref: '#/$defs/EntityType'
      entity_id:
        $ref: '#/$defs/UUID'
      file_name:
        type: string
        minLength: 1
        maxLength: 255
      content_type:
        type: string
        minLength: 1
        maxLength: 255
      size_bytes:
        type: integer
        minimum: 0
        maximum: 5242880
      checksum_sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
      status:
        $ref: '#/$defs/AttachmentStatus'
      scan_verdict:
        $ref: '#/$defs/AttachmentScanVerdict'
      rejection_reason:
        anyOf:
          - type: string
            minLength: 1
            maxLength: 120
          - type: 'null'
      uploaded_by:
        $ref: '#/$defs/UUID'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'

  EntityAttachmentList:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/EntityAttachment'

  EntityHistoryPage:
    type: object
    additionalProperties: false
    required: [items, page_info]
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/ConsultationHistoryEntry'
      page_info:
        $ref: '#/$defs/PageInfo'

  BugTriageRequest:
    type: object
    description: Triage payload for a bug consultation.
    additionalProperties: false
    required: [category, priority, triage_notes, bug_criteria]
    properties:
      category:
        const: bug
      priority:
        $ref: '#/$defs/Priority'
      business_impact:
        anyOf:
          - $ref: '#/$defs/BusinessImpact'
          - type: 'null'
      business_urgency:
        anyOf:
          - $ref: '#/$defs/BusinessUrgency'
          - type: 'null'
      priority_override_reason:
        type: [string, 'null']
        minLength: 10
        maxLength: 300
      triage_notes:
        type: string
        minLength: 5
      bug_criteria:
        $ref: '#/$defs/BugCriteria'

  FeatureTriageRequest:
    type: object
    description: Triage payload for a feature consultation.
    additionalProperties: false
    required: [category, priority, triage_notes, feature_criteria]
    properties:
      category:
        const: feature
      priority:
        $ref: '#/$defs/Priority'
      business_impact:
        anyOf:
          - $ref: '#/$defs/BusinessImpact'
          - type: 'null'
      business_urgency:
        anyOf:
          - $ref: '#/$defs/BusinessUrgency'
          - type: 'null'
      priority_override_reason:
        type: [string, 'null']
        minLength: 10
        maxLength: 300
      triage_notes:
        type: string
        minLength: 5
      feature_criteria:
        $ref: '#/$defs/FeatureCriteria'

  ChoreTriageRequest:
    type: object
    description: Triage payload for a chore consultation.
    additionalProperties: false
    required: [category, priority, triage_notes, chore_criteria]
    properties:
      category:
        const: chore
      priority:
        $ref: '#/$defs/Priority'
      business_impact:
        anyOf:
          - $ref: '#/$defs/BusinessImpact'
          - type: 'null'
      business_urgency:
        anyOf:
          - $ref: '#/$defs/BusinessUrgency'
          - type: 'null'
      priority_override_reason:
        type: [string, 'null']
        minLength: 10
        maxLength: 300
      triage_notes:
        type: string
        minLength: 5
      chore_criteria:
        $ref: '#/$defs/ChoreCriteria'

  DocsTriageRequest:
    type: object
    description: Triage payload for a documentation consultation.
    additionalProperties: false
    required: [category, priority, triage_notes, docs_criteria]
    properties:
      category:
        const: docs
      priority:
        $ref: '#/$defs/Priority'
      business_impact:
        anyOf:
          - $ref: '#/$defs/BusinessImpact'
          - type: 'null'
      business_urgency:
        anyOf:
          - $ref: '#/$defs/BusinessUrgency'
          - type: 'null'
      priority_override_reason:
        type: [string, 'null']
        minLength: 10
        maxLength: 300
      triage_notes:
        type: string
        minLength: 5
      docs_criteria:
        $ref: '#/$defs/DocsCriteria'

  SecurityTriageRequest:
    type: object
    description: Triage payload for a security consultation.
    additionalProperties: false
    required: [category, priority, triage_notes, security_criteria]
    properties:
      category:
        const: security
      priority:
        $ref: '#/$defs/Priority'
      business_impact:
        anyOf:
          - $ref: '#/$defs/BusinessImpact'
          - type: 'null'
      business_urgency:
        anyOf:
          - $ref: '#/$defs/BusinessUrgency'
          - type: 'null'
      priority_override_reason:
        type: [string, 'null']
        minLength: 10
        maxLength: 300
      triage_notes:
        type: string
        minLength: 5
      security_criteria:
        $ref: '#/$defs/SecurityCriteria'

  TriageConsultationRequest:
    description: >-
      Request DTO for POST
      /v1/workspaces/{workspace_id}/consultations/{consultation_id}/triage. The
      category discriminates exactly one criteria variant: the request must
      supply that category's criteria object and no other.
    oneOf:
      - $ref: '#/$defs/BugTriageRequest'
      - $ref: '#/$defs/FeatureTriageRequest'
      - $ref: '#/$defs/ChoreTriageRequest'
      - $ref: '#/$defs/DocsTriageRequest'
      - $ref: '#/$defs/SecurityTriageRequest'
    discriminator:
      propertyName: category
      mapping:
        bug: '#/$defs/BugTriageRequest'
        feature: '#/$defs/FeatureTriageRequest'
        chore: '#/$defs/ChoreTriageRequest'
        docs: '#/$defs/DocsTriageRequest'
        security: '#/$defs/SecurityTriageRequest'

  ReclassifyConsultationRequest:
    type: object
    description: >-
      Request DTO for POST
      /v1/workspaces/{workspace_id}/consultations/{consultation_id}/reclassify.
      Reclassifies an already-triaged consultation. The explicit justification
      is recorded in the append-only audit trail together with the previous and
      new category and criteria snapshot.
    additionalProperties: false
    required: [justification, triage]
    properties:
      justification:
        type: string
        minLength: 10
      triage:
        $ref: '#/$defs/TriageConsultationRequest'

  TriageTemplate:
    type: object
    description: >-
      Reusable backend metadata describing one differentiated triage category.
      Templates are guidance contracts, not client UIs and not auto-classifiers.
    additionalProperties: false
    required: [category, title, description, guidance, required_fields]
    properties:
      category:
        $ref: '#/$defs/TriageCategory'
      title:
        type: string
        minLength: 1
      description:
        type: string
        minLength: 1
      guidance:
        type: string
        minLength: 1
      required_fields:
        type: array
        minItems: 1
        items:
          type: string

  TriageTemplates:
    type: object
    description: The reusable triage templates for the differentiated categories.
    additionalProperties: false
    required: [templates]
    properties:
      templates:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/TriageTemplate'

  CreateProposalRequest:
    type: object
    description: >-
      Request DTO for POST /v1/workspaces/{workspace_id}/proposals and
      POST /v1/workspaces/{workspace_id}/proposals/preview. A consultation may
      yield zero, one, or many independent proposals; each accepted creation is
      version 1 of a new proposal.
    additionalProperties: false
    required: [consultation_id, title, technical_description, scope, justification, acceptance_criteria, category, priority]
    properties:
      consultation_id:
        $ref: '#/$defs/UUID'
      title:
        type: string
        minLength: 5
        maxLength: 200
      technical_description:
        type: string
        minLength: 10
      scope:
        type: string
        minLength: 5
      justification:
        type: string
        minLength: 5
      acceptance_criteria:
        type: array
        minItems: 1
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 500
      category:
        $ref: '#/$defs/TriageCategory'
      priority:
        $ref: '#/$defs/Priority'
      checklist:
        type: array
        maxItems: 100
        items:
          $ref: '#/$defs/ChecklistItem'
      risks:
        type: array
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 500
      dependencies:
        type: array
        maxItems: 50
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 200
      evidence_ids:
        type: array
        maxItems: 50
        uniqueItems: true
        items:
          $ref: '#/$defs/UUID'
      estimated_hours:
        type: number
        minimum: 0.5
        maximum: 9999.99

  UpdateProposalRequest:
    type: object
    description: >-
      Request DTO for PATCH /v1/workspaces/{workspace_id}/proposals/{proposal_id}.
      Only a draft or changes-requested proposal may be edited; an accepted edit
      appends a new immutable revision.
    additionalProperties: false
    minProperties: 1
    properties:
      title:
        type: string
        minLength: 5
        maxLength: 200
      technical_description:
        type: string
        minLength: 10
      scope:
        type: string
        minLength: 5
      justification:
        type: string
        minLength: 5
      acceptance_criteria:
        type: array
        minItems: 1
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 500
      checklist:
        type: array
        maxItems: 100
        items:
          $ref: '#/$defs/ChecklistItem'
      category:
        $ref: '#/$defs/TriageCategory'
      priority:
        $ref: '#/$defs/Priority'
      risks:
        type: array
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 500
      dependencies:
        type: array
        maxItems: 50
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 200
      evidence_ids:
        type: array
        maxItems: 50
        uniqueItems: true
        items:
          $ref: '#/$defs/UUID'
      estimated_hours:
        type: number
        minimum: 0.5
        maximum: 9999.99

  DuplicateProposalRequest:
    type: object
    description: >-
      Request DTO for
      POST /v1/workspaces/{workspace_id}/proposals/{proposal_id}/duplicate.
      Duplication creates a new independent draft proposal; it never creates a
      WorkItem or BoardCard.
    additionalProperties: false
    properties:
      title:
        type: string
        minLength: 5
        maxLength: 200
      supersede_source:
        type: boolean
        default: false
        description: When true, the source proposal is marked superseded.

  ProposalPreview:
    type: object
    description: >-
      Normalized, unpersisted proposal draft returned by the preview operation.
    additionalProperties: false
    required: [consultation_id, workspace_id, project_id, version, title, technical_description, scope, justification, acceptance_criteria, checklist, category, priority, risks, dependencies, evidence, status]
    properties:
      consultation_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      project_id:
        $ref: '#/$defs/UUID'
      version:
        type: integer
        minimum: 1
      title:
        type: string
        minLength: 5
        maxLength: 200
      technical_description:
        type: string
        minLength: 10
      scope:
        type: string
        minLength: 5
      justification:
        type: string
        minLength: 5
      acceptance_criteria:
        type: array
        minItems: 1
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 500
      checklist:
        type: array
        maxItems: 100
        items:
          $ref: '#/$defs/ChecklistItem'
      category:
        $ref: '#/$defs/TriageCategory'
      priority:
        $ref: '#/$defs/Priority'
      risks:
        type: array
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 500
      dependencies:
        type: array
        maxItems: 50
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 200
      evidence:
        type: array
        maxItems: 50
        uniqueItems: true
        items:
          $ref: '#/$defs/UUID'
      estimated_hours:
        anyOf:
          - type: number
            minimum: 0.5
            maximum: 9999.99
          - type: 'null'
      status:
        $ref: '#/$defs/ProposalStatus'

  ProposalRevision:
    type: object
    description: One immutable snapshot in a proposal's revision history.
    additionalProperties: false
    required: [revision_id, proposal_id, workspace_id, version, author_id, snapshot, created_at]
    properties:
      revision_id:
        $ref: '#/$defs/UUID'
      proposal_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      version:
        type: integer
        minimum: 1
      author_id:
        $ref: '#/$defs/UUID'
      summary:
        anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
      snapshot:
        type: object
        description: Immutable content snapshot captured at this version.
      created_at:
        $ref: '#/$defs/RFC3339DateTime'

  DecideProposalRequest:
    type: object
    description: Request DTO for POST /v1/workspaces/{workspace_id}/proposals/{proposal_id}/decide.
    additionalProperties: false
    required: [proposal_version, decision, decision_justification]
    properties:
      proposal_version:
        type: integer
        minimum: 1
      decision:
        $ref: '#/$defs/ApprovalDecision'
      decision_justification:
        type: string
        minLength: 3
      target_board_id:
        $ref: '#/$defs/UUID'
        description: Required for an approved decision; it must be in the proposal's workspace and project.
    allOf:
      - if:
          properties:
            decision:
              const: approved
          required: [decision]
        then:
          required: [target_board_id]

  DecideProposalResponse:
    type: object
    description: Response DTO for a recorded approval decision.
    additionalProperties: false
    required: [approval]
    properties:
      approval:
        $ref: '#/$defs/Approval'
      work_item:
        $ref: '#/$defs/WorkItem'
      board_card:
        $ref: '#/$defs/BoardCard'
    allOf:
      - if:
          properties:
            approval:
              properties:
                decision:
                  const: approved
              required: [decision]
          required: [approval]
        then:
          required: [work_item, board_card]

  MoveBoardCardRequest:
    type: object
    description: Request DTO for PATCH /v1/workspaces/{workspace_id}/boards/{board_id}/cards/{card_id}.
    additionalProperties: false
    required: [target_column_id, target_rank]
    properties:
      target_column_id:
        type: string
        minLength: 1
        maxLength: 80
      target_rank:
        type: string
        minLength: 1
        maxLength: 64
        description: Opaque ordering key matching the persisted BoardCard rank constraint.
        pattern: '^[0-9a-zA-Z_-]+$'

  BoardColumnInput:
    type: object
    description: One column definition supplied when creating a board.
    additionalProperties: false
    required: [key, name, mapped_status]
    properties:
      key:
        type: string
        minLength: 1
        maxLength: 80
        pattern: '^[a-z0-9][a-z0-9_-]{0,79}$'
      name:
        type: string
        minLength: 1
        maxLength: 120
      mapped_status:
        $ref: '#/$defs/WorkItemStatus'
      wip_limit:
        anyOf:
          - type: integer
            minimum: 1
          - type: 'null'

  CreateBoardRequest:
    type: object
    description: Request DTO for POST /v1/workspaces/{workspace_id}/boards.
    additionalProperties: false
    required: [project_id, name]
    properties:
      project_id:
        $ref: '#/$defs/UUID'
      name:
        type: string
        minLength: 1
        maxLength: 120
      columns:
        type: array
        minItems: 1
        maxItems: 50
        items:
          $ref: '#/$defs/BoardColumnInput'

  UpdateBoardRequest:
    type: object
    description: Request DTO for PATCH /v1/workspaces/{workspace_id}/boards/{board_id}.
    additionalProperties: false
    minProperties: 1
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 120
      archived:
        type: boolean

  CreateBoardColumnRequest:
    type: object
    description: >-
      Request DTO for POST
      /v1/workspaces/{workspace_id}/boards/{board_id}/columns.
    additionalProperties: false
    required: [key, name, mapped_status]
    properties:
      key:
        type: string
        minLength: 1
        maxLength: 80
        pattern: '^[a-z0-9][a-z0-9_-]{0,79}$'
      name:
        type: string
        minLength: 1
        maxLength: 120
      mapped_status:
        $ref: '#/$defs/WorkItemStatus'
      wip_limit:
        anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
      position:
        type: integer
        minimum: 0

  UpdateBoardColumnRequest:
    type: object
    description: >-
      Request DTO for PATCH
      /v1/workspaces/{workspace_id}/boards/{board_id}/columns/{column_id}.
    additionalProperties: false
    minProperties: 1
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 120
      mapped_status:
        $ref: '#/$defs/WorkItemStatus'
      wip_limit:
        anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
      position:
        type: integer
        minimum: 0

  PageInfo:
    type: object
    description: Cursor pagination metadata shared by list responses.
    additionalProperties: false
    required: [has_more]
    properties:
      next_cursor:
        type: [string, 'null']
        description: Opaque cursor for the next page; null when has_more is false.
      has_more:
        type: boolean
    allOf:
      - if:
          properties:
            has_more:
              const: true
          required: [has_more]
        then:
          required: [next_cursor]
          properties:
            next_cursor:
              type: string
              minLength: 1
      - if:
          properties:
            has_more:
              const: false
          required: [has_more]
        then:
          required: [next_cursor]
          properties:
            next_cursor:
              type: 'null'

  ConsultationPage:
    type: object
    additionalProperties: false
    required: [items, page_info]
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/Consultation'
      page_info:
        $ref: '#/$defs/PageInfo'

  WorkItemPage:
    type: object
    additionalProperties: false
    required: [items, page_info]
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/WorkItem'
      page_info:
        $ref: '#/$defs/PageInfo'

  BoardCardPage:
    type: object
    additionalProperties: false
    required: [items, page_info]
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/BoardCard'
      page_info:
        $ref: '#/$defs/PageInfo'

  ProposalPage:
    type: object
    additionalProperties: false
    required: [items, page_info]
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/Proposal'
      page_info:
        $ref: '#/$defs/PageInfo'

  ProposalRevisionPage:
    type: object
    additionalProperties: false
    required: [items, page_info]
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/ProposalRevision'
      page_info:
        $ref: '#/$defs/PageInfo'

  CardMovementPage:
    type: object
    additionalProperties: false
    required: [items, page_info]
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/CardMovement'
      page_info:
        $ref: '#/$defs/PageInfo'

  MembershipState:
    type: string
    description: >-
      Lifecycle of a workspace membership binding. A revoked row is retained for
      the audit trail and does not block re-invitation.
    enum: [active, revoked]

  InvitationState:
    type: string
    description: Lifecycle of an identity-bound workspace invitation.
    enum: [pending, accepted, revoked, expired]

  WorkspaceMember:
    type: object
    description: >-
      The tenant-scoped authorization binding for one verified identity. Issued by
      Issue #9 membership administration.
    required: [membership_id, workspace_id, user_id, role, state, created_at, updated_at]
    additionalProperties: false
    properties:
      membership_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      user_id:
        $ref: '#/$defs/UUID'
      role:
        $ref: '#/$defs/Role'
      state:
        $ref: '#/$defs/MembershipState'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  WorkspaceInvitation:
    type: object
    description: >-
      A pending, identity-bound offer to join a workspace. The bearer token is
      never persisted; only its digest is stored.
    required: [invitation_id, workspace_id, invited_user_id, role, state, expires_at, created_at]
    additionalProperties: false
    properties:
      invitation_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      invited_user_id:
        $ref: '#/$defs/UUID'
      invited_email:
        anyOf:
          - type: string
            minLength: 3
            maxLength: 320
          - type: 'null'
      role:
        $ref: '#/$defs/Role'
      state:
        $ref: '#/$defs/InvitationState'
      expires_at:
        $ref: '#/$defs/RFC3339DateTime'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      accepted_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
      revoked_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'

  CreatedInvitation:
    type: object
    description: >-
      Response for a created invitation: the persisted invitation plus the
      one-time bearer token the administrator must deliver out of band. The token
      is not retrievable again.
    required: [invitation, token]
    additionalProperties: false
    properties:
      invitation:
        $ref: '#/$defs/WorkspaceInvitation'
      token:
        type: string
        minLength: 16
        maxLength: 512
        description: One-time invitation token; stored only as a SHA-256 digest.

  CreateWorkspaceRequest:
    type: object
    description: Request DTO for POST /v1/workspaces.
    additionalProperties: false
    required: [name, slug]
    properties:
      name:
        type: string
        minLength: 3
        maxLength: 120
      slug:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        maxLength: 80

  UpdateWorkspaceRequest:
    type: object
    description: Request DTO for PATCH /v1/workspaces/{workspace_id}.
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        minLength: 3
        maxLength: 120

  CreateProjectRequest:
    type: object
    description: Request DTO for POST /v1/workspaces/{workspace_id}/projects.
    additionalProperties: false
    required: [key, name]
    properties:
      key:
        type: string
        pattern: ^[A-Z][A-Z0-9]{1,9}$
      name:
        type: string
        minLength: 3
        maxLength: 120
      description:
        anyOf:
          - type: string
            minLength: 1
          - type: 'null'

  UpdateProjectRequest:
    type: object
    description: Request DTO for PATCH /v1/workspaces/{workspace_id}/projects/{project_id}.
    additionalProperties: false
    minProperties: 1
    properties:
      name:
        type: string
        minLength: 3
        maxLength: 120
      description:
        anyOf:
          - type: string
            minLength: 1
          - type: 'null'

  ChangeMemberRoleRequest:
    type: object
    description: Request DTO for PATCH /v1/workspaces/{workspace_id}/members/{membership_id}.
    additionalProperties: false
    required: [role]
    properties:
      role:
        $ref: '#/$defs/Role'

  CreateInvitationRequest:
    type: object
    description: Request DTO for POST /v1/workspaces/{workspace_id}/invitations.
    additionalProperties: false
    required: [invited_user_id, role]
    properties:
      invited_user_id:
        $ref: '#/$defs/UUID'
      role:
        $ref: '#/$defs/Role'
      invited_email:
        anyOf:
          - type: string
            minLength: 3
            maxLength: 320
          - type: 'null'
      expires_in_seconds:
        type: integer
        minimum: 300
        maximum: 2592000
        default: 1209600
        description: Invitation lifetime; defaults to fourteen days.

  AcceptInvitationRequest:
    type: object
    description: Request DTO for POST /v1/workspaces/{workspace_id}/invitations/{invitation_id}/accept.
    additionalProperties: false
    required: [token]
    properties:
      token:
        type: string
        minLength: 16
        maxLength: 512

  ErrorResponse:
    type: object
    description: >-
      RFC 9457 problem details (media type application/problem+json). This is
      the single Work Management error shape; it shares the core member names
      and types with the EventFlow error model while preserving the RFC optional
      semantics and keeping these contracts free of cross-domain references.
    required: [correlation_id]
    properties:
      type:
        type: string
        format: uri-reference
        description: >-
          Problem type URI reference. If omitted, clients treat it as
          about:blank as specified by RFC 9457.
      title:
        type: string
        minLength: 1
        description: Short human-readable summary of the problem type.
      status:
        type: integer
        minimum: 400
        maximum: 599
        description: >-
          If present, this advisory status must match the actual HTTP response
          status.
      detail:
        type: string
        minLength: 1
        description: >-
          Optional occurrence-specific public diagnostic detail; never a stack
          trace, SQL statement, secret, or provider-internal error.
      instance:
        type: string
        format: uri-reference
        description: URI reference identifying this specific problem occurrence when available.
      code:
        type: string
        description: Stable, machine-readable error code for client branching.
        enum:
          - VALIDATION_ERROR
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - CONFLICT
          - IDEMPOTENCY_CONFLICT
          - INVALID_STATE
          - STALE_VERSION
          - SELF_APPROVAL_DISALLOWED
          - DEPENDENCY_UNAVAILABLE
          - PRECONDITION_FAILED
          - REPOSITORY_ALREADY_LINKED
          - REPOSITORY_ARCHIVED
          - INTERNAL_ERROR
      correlation_id:
        $ref: '#/$defs/UUID'
      request_id:
        $ref: '#/$defs/UUID'
      errors:
        type: array
        items:
          type: object
          additionalProperties: true
          required: [field, message]
          properties:
            field:
              type: string
              minLength: 1
            message:
              type: string
              minLength: 1

  RemoteProvider:
    type: string
    description: Supported external repository providers.
    enum: [github, gitlab]

  ProjectRepositoryStatus:
    type: string
    description: >-
      Lifecycle of a project repository association. Archived is terminal and is
      reached through DELETE; it is never set directly.
    enum: [active, inactive, archived]

  ProjectRepositoryVerificationStatus:
    type: string
    description: >-
      Whether ownership of the remote repository has been verified. Issue #44
      performs no provider calls, so newly configured associations are always
      configured.
    enum: [configured, verified]

  ProjectRepository:
    type: object
    description: >-
      Stable link between one project and one remote GitHub/GitLab repository.
      Identity is the provider instance plus the provider-assigned repository id;
      the URL is normalized metadata and is not used for deduplication.
    required:
      - repository_id
      - workspace_id
      - project_id
      - provider
      - provider_instance_id
      - remote_repository_id
      - repository_url
      - repository_full_path
      - display_name
      - status
      - verification_status
      - version
      - created_by
      - created_at
      - updated_at
    additionalProperties: false
    properties:
      repository_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      project_id:
        $ref: '#/$defs/UUID'
      provider:
        $ref: '#/$defs/RemoteProvider'
      provider_instance_id:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[a-z0-9]([a-z0-9.-]{0,253}[a-z0-9])?$'
        description: Provider host name; distinct from any installation id.
      remote_repository_id:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,119}$'
        description: Provider-assigned stable repository identifier.
      repository_url:
        type: string
        pattern: '^https://'
        maxLength: 500
        description: Canonical credential-free HTTPS repository URL.
      repository_full_path:
        type: string
        pattern: '^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)+$'
        maxLength: 255
      display_name:
        type: string
        minLength: 1
        maxLength: 200
      default_branch:
        anyOf:
          - type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$'
          - type: 'null'
      status:
        $ref: '#/$defs/ProjectRepositoryStatus'
      verification_status:
        $ref: '#/$defs/ProjectRepositoryVerificationStatus'
      version:
        type: integer
        minimum: 1
        description: Optimistic-concurrency version used by If-Match.
      created_by:
        $ref: '#/$defs/UUID'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'
      deactivated_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
        description: Set only while the association is inactive.
      archived_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
        description: Set when the association is archived; archived is terminal.

  CreateProjectRepositoryRequest:
    type: object
    additionalProperties: false
    required:
      - provider
      - provider_instance_id
      - remote_repository_id
      - repository_url
    properties:
      provider:
        $ref: '#/$defs/RemoteProvider'
      provider_instance_id:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[a-z0-9]([a-z0-9.-]{0,253}[a-z0-9])?$'
      remote_repository_id:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,119}$'
      repository_url:
        type: string
        minLength: 1
        maxLength: 500
        description: >-
          HTTPS repository URL, or an SSH/scp-like form
          (ssh://git@host/path or git@host:path). Credentials, ports, query
          strings, and fragments are rejected.
      repository_full_path:
        anyOf:
          - type: string
            pattern: '^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)+$'
            maxLength: 255
          - type: 'null'
      display_name:
        anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
      default_branch:
        anyOf:
          - type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$'
          - type: 'null'

  UpdateProjectRepositoryRequest:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      display_name:
        anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
      default_branch:
        anyOf:
          - type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$'
          - type: 'null'
        description: Null clears the configured default branch.
      status:
        type: string
        enum: [active, inactive]
        description: >-
          Active or inactive only. Reactivating an inactive association is
          status active; archiving is DELETE.

  ProjectRepositoryPage:
    type: object
    additionalProperties: false
    required: [items, page_info]
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/ProjectRepository'
      page_info:
        $ref: '#/$defs/PageInfo'

  BusinessImpact:
    type: string
    enum: [critical, high, moderate, low]

  BusinessUrgency:
    type: string
    enum: [immediate, elevated, normal, low]

  SlaPolicyStatus:
    type: string
    enum: [draft, active, retired]

  SlaInstanceStatus:
    type: string
    enum: [pending, running, paused, fulfilled, breached, cancelled]

  SlaEventType:
    type: string
    enum:
      - started
      - paused
      - resumed
      - warning_response
      - warning_resolution
      - breach_response
      - breach_resolution
      - fulfilled
      - cancelled

  NotificationEventType:
    type: string
    enum:
      - dependency.created
      - dependency.removed
      - sla.warning
      - sla.breached
      - sla.fulfilled
      - work_item.priority_overridden
      - work_item.blocked

  SlaPolicy:
    type: object
    description: One immutable version of a scoped SLA policy.
    additionalProperties: false
    required: [policy_id, workspace_id, name, version, status, timezone, business_hours, holidays, pause_statuses, warning_threshold_percent, created_by, created_at, updated_at]
    properties:
      policy_id:
        $ref: '#/$defs/UUID'
      workspace_id:
        $ref: '#/$defs/UUID'
      project_id:
        anyOf:
          - $ref: '#/$defs/UUID'
          - type: 'null'
        description: Null means the policy is the workspace default.
      name:
        type: string
        minLength: 1
        maxLength: 120
      version:
        type: integer
        minimum: 1
      status:
        $ref: '#/$defs/SlaPolicyStatus'
      response_minutes:
        anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
      resolution_minutes:
        anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
      timezone:
        type: string
        minLength: 1
        maxLength: 64
      business_hours:
        type: object
        additionalProperties: true
      holidays:
        type: array
        items:
          type: string
          format: date
      pause_statuses:
        type: array
        items:
          $ref: '#/$defs/WorkItemStatus'
      warning_threshold_percent:
        type: integer
        minimum: 1
        maximum: 99
      created_by:
        $ref: '#/$defs/UUID'
      activated_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
      retired_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  SlaPolicyPage:
    type: object
    additionalProperties: false
    required: [items, page_info]
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/SlaPolicy'
      page_info:
        $ref: '#/$defs/PageInfo'

  SlaEvent:
    type: object
    additionalProperties: false
    required: [event_id, event_type, due_at, occurred_at, payload]
    properties:
      event_id:
        $ref: '#/$defs/UUID'
      event_type:
        $ref: '#/$defs/SlaEventType'
      due_at:
        $ref: '#/$defs/RFC3339DateTime'
      occurred_at:
        $ref: '#/$defs/RFC3339DateTime'
      payload:
        type: object
        additionalProperties: true

  SlaPauseInterval:
    type: object
    additionalProperties: false
    required: [pause_id, reason, started_at, ended_at, seconds]
    properties:
      pause_id:
        $ref: '#/$defs/UUID'
      reason:
        type: string
      started_at:
        $ref: '#/$defs/RFC3339DateTime'
      ended_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
      seconds:
        type: integer
        minimum: 0

  SlaInstance:
    type: object
    description: A durable SLA clock pinned to one policy version snapshot.
    additionalProperties: false
    required: [sla_instance_id, work_item_id, project_id, policy_id, policy_version, policy_snapshot, status, started_at, paused_seconds, updated_at]
    properties:
      sla_instance_id:
        $ref: '#/$defs/UUID'
      work_item_id:
        $ref: '#/$defs/UUID'
      project_id:
        $ref: '#/$defs/UUID'
      policy_id:
        $ref: '#/$defs/UUID'
      policy_version:
        type: integer
        minimum: 1
      policy_snapshot:
        type: object
        additionalProperties: true
      status:
        $ref: '#/$defs/SlaInstanceStatus'
      started_at:
        $ref: '#/$defs/RFC3339DateTime'
      response_due_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
      resolution_due_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
      first_response_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
      resolved_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
      paused_seconds:
        type: integer
        minimum: 0
      warning_response_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
      warning_resolution_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
      breach_response_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
      breach_resolution_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
      next_evaluation_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  WorkItemSla:
    type: object
    description: The SLA view of one WorkItem. The instance is null when no policy applies.
    additionalProperties: false
    required: [work_item_id, instance, events, pauses]
    properties:
