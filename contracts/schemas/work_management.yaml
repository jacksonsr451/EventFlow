  CreateDependencyRequest:
    type: object
    additionalProperties: false
    required: [blocking_work_item_id]
    properties:
      blocking_work_item_id:
        $ref: '#/$defs/UUID'

  Notification:
    type: object
    additionalProperties: false
    required: [notification_id, event_type, entity_type, entity_id, title, body, payload, read_at, created_at]
    properties:
      notification_id:
        $ref: '#/$defs/UUID'
      event_type:
        $ref: '#/$defs/NotificationEventType'
      entity_type:
        type: string
      entity_id:
        $ref: '#/$defs/UUID'
      title:
        type: string
      body:
        type: string
      payload:
        type: object
        additionalProperties: true
      read_at:
        anyOf:
          - $ref: '#/$defs/RFC3339DateTime'
          - type: 'null'
      created_at:
        $ref: '#/$defs/RFC3339DateTime'

  NotificationPage:
    type: object
    additionalProperties: false
    required: [items, unread_count, page_info]
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/Notification'
      unread_count:
        type: integer
        minimum: 0
      page_info:
        $ref: '#/$defs/PageInfo'

  NotificationPreference:
    type: object
    additionalProperties: false
    required: [event_type, in_app, email, version, updated_at]
    properties:
      event_type:
        $ref: '#/$defs/NotificationEventType'
      in_app:
        type: boolean
      email:
        type: boolean
      version:
        type: integer
        minimum: 1
      updated_at:
        $ref: '#/$defs/RFC3339DateTime'

  NotificationPreferenceList:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: '#/$defs/NotificationPreference'

  MarkNotificationRequest:
    type: object
    additionalProperties: false
    required: [read]
    properties:
      read:
        type: boolean

  UpdatePreferenceRequest:
    type: object
    additionalProperties: false
    required: [in_app, email]
    properties:
      in_app:
        type: boolean
      email:
        type: boolean
