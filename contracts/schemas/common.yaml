$schema: https://json-schema.org/draft/2020-12/schema
title: EventFlow shared schemas
type: object
$defs:
  UUID:
    type: string
    format: uuid
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
  Timestamp:
    type: string
    format: date-time
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
  Currency:
    type: string
    pattern: '^[A-Z]{3}$'
  Money:
    type: object
    additionalProperties: true
    required: [amount, currency]
    properties:
      amount:
        type: string
        pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        description: Decimal string; binary floating point is not permitted.
      currency:
        $ref: '#/$defs/Currency'
  OrderStatus:
    type: string
    enum: [PENDING, STOCK_RESERVED, PAYMENT_PROCESSING, CONFIRMED, CANCELLING, CANCELLED]
  ReservationStatus:
    type: string
    enum: [ACTIVE, CONSUMED, RELEASED, EXPIRED]
  PaymentState:
    type: string
    enum: [AUTHORIZED, CAPTURED, UNKNOWN, PROCESSING, DECLINED]
  CompensationResult:
    type: string
    enum: [COMPLETED]
  EventType:
    type: string
    enum:
      - order.created
      - inventory.reservation.requested
      - inventory.reserved
      - inventory.rejected
      - payment.requested
      - payment.approved
      - payment.declined
      - payment.processing
      - payment.unknown
      - inventory.release.requested
      - inventory.released
      - payment.compensation.requested
      - payment.compensated
      - order.confirmed
      - order.cancelled
  IdentifierEnvelope:
    type: object
    additionalProperties: true
    required: [order_id]
    properties:
      order_id:
        $ref: '#/$defs/UUID'
  CartItem:
    type: object
    additionalProperties: true
    required: [sku, quantity]
    properties:
      sku:
        type: string
        minLength: 1
      quantity:
        type: integer
        minimum: 1
  PriceQuote:
    type: object
    additionalProperties: true
    required: [quote_id, sku, unit_price, currency, valid_until]
    properties:
      quote_id:
        $ref: '#/$defs/UUID'
      sku:
        type: string
        minLength: 1
      unit_price:
        type: string
        pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
      currency:
        $ref: '#/$defs/Currency'
      valid_until:
        $ref: '#/$defs/Timestamp'
  AcceptedOrderItem:
    type: object
    additionalProperties: true
    required: [sku, quantity, quote_id, unit_price, currency]
    properties:
      sku:
        type: string
        minLength: 1
      quantity:
        type: integer
        minimum: 1
      quote_id:
        $ref: '#/$defs/UUID'
      unit_price:
        type: string
        pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
      currency:
        $ref: '#/$defs/Currency'
  ReservationItem:
    type: object
    additionalProperties: true
    required: [sku, quantity]
    properties:
      sku:
        type: string
        minLength: 1
      quantity:
        type: integer
        minimum: 1
  Order:
    type: object
    additionalProperties: true
    required: [order_id, status, items, correlation_id, created_at]
    properties:
      order_id:
        $ref: '#/$defs/UUID'
      status:
        $ref: '#/$defs/OrderStatus'
      items:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/AcceptedOrderItem'
      correlation_id:
        $ref: '#/$defs/UUID'
      created_at:
        $ref: '#/$defs/Timestamp'
  Reservation:
    type: object
    additionalProperties: true
    required: [reservation_id, order_id, status, created_at, expires_at, items]
    properties:
      reservation_id:
        $ref: '#/$defs/UUID'
      order_id:
        $ref: '#/$defs/UUID'
      status:
        $ref: '#/$defs/ReservationStatus'
      created_at:
        $ref: '#/$defs/Timestamp'
      expires_at:
        $ref: '#/$defs/Timestamp'
      items:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/ReservationItem'
  Payment:
    type: object
    additionalProperties: true
    required: [payment_id, order_id, status]
    properties:
      payment_id:
        $ref: '#/$defs/UUID'
      order_id:
        $ref: '#/$defs/UUID'
      status:
        $ref: '#/$defs/PaymentState'
      amount:
        $ref: '#/$defs/Money'
  NotificationOperation:
    type: object
    additionalProperties: true
    required: [notification_id, source_event_id, correlation_id, channel, status, attempts]
    properties:
      notification_id:
        $ref: '#/$defs/UUID'
      source_event_id:
        $ref: '#/$defs/UUID'
      correlation_id:
        $ref: '#/$defs/UUID'
      channel:
        type: string
        minLength: 1
      status:
        type: string
        enum: [PENDING, PROCESSING, SENT, FAILED]
      attempts:
        type: integer
        minimum: 0
  Error:
    type: object
    required: [type, title, status, detail, correlation_id]
    properties:
      type:
        type: string
        format: uri-reference
      title:
        type: string
      status:
        type: integer
        minimum: 400
        maximum: 599
      code:
        type: string
        enum:
          - VALIDATION_ERROR
          - NOT_FOUND
          - UNAUTHORIZED
          - FORBIDDEN
          - CONFLICT
          - IDEMPOTENCY_CONFLICT
          - QUOTE_EXPIRED
          - INVALID_QUOTE
          - DEPENDENCY_UNAVAILABLE
          - INVALID_STATE
      detail:
        type: string
        description: Public diagnostic detail; never a stack trace, SQL, secret or provider-internal error.
      instance:
        type: string
        format: uri-reference
      correlation_id:
        $ref: '#/$defs/UUID'
      request_id:
        $ref: '#/$defs/UUID'
      errors:
        type: array
        items:
          type: object
          additionalProperties: true
          required: [field, message]
          properties:
            field:
              type: string
            message:
              type: string
