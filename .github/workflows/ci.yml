name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install pinned contract tooling
        run: >-
          python -m pip install --disable-pip-version-check
          "PyYAML==6.0.3"
          "jsonschema==4.26.0"
          "jsonschema-specifications==2025.9.1"
          "referencing==0.37.0"
          "openapi-spec-validator==0.9.0"

      - name: Validate contracts, refs, examples and documentation
        run: python scripts/validate_contracts.py

      - name: Validate OpenAPI
        run: openapi-spec-validator contracts/openapi/orders.yaml

      - name: Validate AsyncAPI
        run: npx --yes @asyncapi/cli@6.2.0 validate contracts/asyncapi/workflow.yaml
