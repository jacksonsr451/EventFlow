<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EventFlow work management for consultations, proposals, projects, and delivery teams."
    />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101318" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>EventFlow</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("eventflow.theme");
          var dark =
            theme === "dark" ||
            ((!theme || theme === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>
  <body class="min-h-full bg-background text-foreground antialiased">
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        <h1>EventFlow requires JavaScript</h1>
        <p>Enable JavaScript in your browser to use the work management app.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
