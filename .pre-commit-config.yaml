default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: validate-contracts
        name: Validate contracts and repository references
        entry: python scripts/validate_contracts.py
        language: system
        pass_filenames: false
        files: ^(contracts/|scripts/validate_contracts\.py$|\.github/workflows/ci\.yml$|.*\.md$|\.gitattributes$|Makefile$)
